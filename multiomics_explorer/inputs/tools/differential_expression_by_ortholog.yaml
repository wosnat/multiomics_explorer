# Human-authored content for differential_expression_by_ortholog about page.
# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

verbose_fields:
  - experiment_name
  - treatment
  - omics_type
  - table_scope
  - table_scope_detail

examples:
  - title: Expression across orthologs in a group
    call: differential_expression_by_ortholog(group_ids=["cyanorak:CK_00000570"])

  - title: Compare two groups in specific organisms
    call: differential_expression_by_ortholog(group_ids=["cyanorak:CK_00000570", "eggnog:COG0592@2"], organisms=["MED4", "MIT9313"])

  - title: Full pipeline from text to expression
    steps: |
      Step 1: search_homolog_groups(search_text="photosystem II")
              → collect group_ids

      Step 2: differential_expression_by_ortholog(group_ids=[...],
                organisms=["MED4", "MIT9313"])
              → triage: which groups have expression?

      Step 3 (if detail needed): genes_by_homolog_group(group_ids=[...], organisms=["MED4"])
              → member locus_tags per organism, then
              differential_expression_by_gene(locus_tags=[...], experiment_ids=[...])
              once per organism for the per-gene rows (or script it — see
              docs://guide/python_api)

chaining:
  - "search_homolog_groups → differential_expression_by_ortholog"
  - "gene_homologs → differential_expression_by_ortholog"
  - "genes_by_homolog_group (triage) → differential_expression_by_ortholog"
  - "differential_expression_by_ortholog → list_experiments(experiment_ids=[...], verbose=True) for partner roles — the row's `coculture_partner` is a flat list of every organism sharing the culture (treatment and background partners); `coculture_partners[].role` tells them apart"
  - "differential_expression_by_ortholog → genes_by_homolog_group(organisms=[...]) → differential_expression_by_gene per organism (per-gene detail behind a group × experiment row; loop it in Python per docs://guide/python_api)"

mistakes:
  - "A DE timepoint label (e.g. 'day 18') and `growth_phase` describe the treatment arm; check the row's `control_timing`, and `design_notes` via list_experiments(experiment_ids=[...]), before reading it as both arms' state. See docs://guide/conventions."
  - "Bare group ids ('CK_00000570', 'COG0592@2') are accepted and coerced to canonical — check `resolved_aliases` for the mapping; prefer the prefixed form ('cyanorak:CK_00000570') to skip coercion."
  - "MCP: pass `organisms` as a list (['MED4']) — a bare string is rejected by the schema (the Python API accepts it as one element)."
  - "This tool does NOT enforce single organism — that is the point"
  - "Results are group × experiment × timepoint (gene counts), not individual genes. For per-gene detail take the group's members from genes_by_homolog_group and call differential_expression_by_gene once per organism (docs://guide/python_api shows the loop)."
  - "Diagnostics are suffixed flat lists: `not_found_groups` / `not_matched_groups`, `not_found_organisms` / `not_matched_organisms`, `not_found_experiments` / `not_matched_experiments`. See docs://guide/conventions for the shared not_found / not_matched semantics."
  - "Unknown `treatment_type` / `background_factors` / `growth_phases` values return 0 rows and land in `warnings`; live value sets via list_filter_values, semantics in docs://guide/conventions."
  - "growth_phase is a timepoint-level condition describing the culture's physiological state at sampling — NOT a gene-specific property"
  - "For cross-experiment summarization patterns see `docs://analysis/expression` — covers `response_matrix` for gene × treatment-group pivots and `gene_set_compare` for two-set comparisons."
  - "Each `organisms` entry is OR-matched word-by-word against preferred_name + name_synonyms, so a genus word (e.g. 'Alteromonas') matches every strain in that genus."
