# Human-authored content for genes_by_metabolite about page.
# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

examples:
  - title: Discovery → drill-down — urea catalysts and transporters in MED4
    call: genes_by_metabolite(metabolite_ids=["kegg.compound:C00086"], organism="Prochlorococcus MED4")
    # response shape: metabolism rows (urease subunits) first, then transport
    # rows sorted most_specific → inherited and, within each depth tier, by
    # tcdb_evidence_score descending.
    # — 10 transport rows at substrate_depth='most_specific': urtABCDE
    #   (PMM0970-PMM0974) on tcdb:3.A.1.4.4 / tcdb:3.A.1.4.5; urtBCDE score
    #   0.8, urtA 0.6.
    # — inherited rows follow: ABC-superfamily (tcdb:3.A.1) genes whose
    #   deepest TCDB attachment is the superfamily itself.
    # top_genes entries carry transport_substrate_resolution + tcdb_evidence_score_max
    # (gene-level facts — not repeated per row).

  - title: Cross-feeding pair (Workflow B) — call once per organism, intersect locus_tags client-side
    steps: |
      Step 1: genes_by_metabolite(metabolite_ids=["kegg.compound:C00064"],
                                  organism="Prochlorococcus MED4")
              → MED4 genes touching glutamine (catalysts + transporters)

      Step 2: genes_by_metabolite(metabolite_ids=["kegg.compound:C00064"],
                                  organism="Alteromonas macleodii MIT1002")
              → MIT1002 genes touching glutamine

      Step 3: intersect / diff the two locus_tag sets client-side. Pair with
              differential_expression_by_gene(experiment filter='coculture',
              locus_tags=...) per organism to test whether one side's
              catalysts go up while the other's transporters do too.

  - title: Narrow to the most specific surviving transporter nodes
    call: genes_by_metabolite(metabolite_ids=["kegg.compound:C00086"], organism="Prochlorococcus MED4", substrate_depth=["most_specific"], evidence_sources=["transport"])
    # response shape: the 10 urtABCDE rows only. No metabolism rows
    # (evidence_sources excludes them) and no inherited rows
    # (substrate_depth drops the superfamily-level attachments). Read
    # tcdb_evidence_score per row to rank within the slice — never as a
    # cut-off.

  - title: Family-level most_specific — nitrite in MED4
    call: genes_by_metabolite(metabolite_ids=["kegg.compound:C00088"], organism="Prochlorococcus MED4", evidence_sources=["transport"])
    # Nitrite surfaces as substrate_depth='most_specific' at a FAMILY node
    # (tcdb:2.A.16, formate-nitrite transporter family): no gene in the KG
    # is annotated below it for this substrate, so the family is the most
    # specific surviving node. 'most_specific' is a position in the
    # gene-pruned hierarchy, not a curation level. The remaining rows are
    # inherited via the ABC superfamily; the auto-warning fires because
    # inherited rows dominate. Rows are deepest-attachment projections:
    # 29 rows over 27 distinct genes here — genes also attached to a
    # descendant of tcdb:3.A.1 contribute only their deepest attachment.

  - title: Pathway-anchored — N-metabolism only
    call: genes_by_metabolite(metabolite_ids=["kegg.compound:C00086", "kegg.compound:C00064", "kegg.compound:C00088"], organism="Prochlorococcus MED4", metabolite_pathway_ids=["kegg.pathway:ko00910"])
    # metabolite_pathway_ids narrows BOTH arms uniformly via
    # Metabolite.pathway_ids. Result: only rows whose metabolite is
    # annotated to KEGG nitrogen-metabolism pathway survive — useful when
    # batch-querying mixed metabolites and you want only the N-pathway slice.

  - title: Currency-cofactor strip — exclude ATP/ADP/NADH/NADPH/H2O on a multi-metabolite drill
    call: |
      genes_by_metabolite(
        metabolite_ids=["kegg.compound:C00064", "kegg.compound:C00086"],
        organism="Prochlorococcus MED4",
        exclude_metabolite_ids=[
          "kegg.compound:C00002",  # ATP
          "kegg.compound:C00008",  # ADP
          "kegg.compound:C00004",  # NADH
          "kegg.compound:C00005",  # NADPH
          "kegg.compound:C00001",  # H2O
        ],
      )
    # Set-difference semantics with `metabolite_ids` — exclude wins on
    # overlap (silent). Per-arm scope: exclude applies on BOTH the
    # metabolism arm and the transport arm (mirrors `metabolite_ids`).
    # Useful when the include set inadvertently pulls cofactor-heavy
    # reactions into the result.

  - title: EC-anchored metabolism narrowing (transport rows still returned)
    call: genes_by_metabolite(metabolite_ids=["kegg.compound:C00064"], organism="Prochlorococcus MED4", ec_numbers=["6.3.1.2"])
    # ec_numbers narrows the metabolism arm WHERE only — transport rows are
    # returned UNCHANGED (per-arm filter scope, not soft-exclude). Result:
    # 1 metabolism row (glnA × glutamine, R00253) plus the inherited
    # ABC-superfamily transport rows; the auto-warning fires because
    # inherited rows dominate. To restrict to metabolism alone, add
    # evidence_sources=["metabolism"].

verbose_fields:
  - gene_category
  - metabolite_inchikey
  - metabolite_smiles
  - metabolite_mnxm_id
  - metabolite_hmdb_id
  - reaction_mnxr_id
  - reaction_rhea_ids
  - tcdb_level_kind
  - tc_class_id

chaining:
  # upstream
  - "list_metabolites(...) → genes_by_metabolite(metabolite_ids=[chosen_ids], organism=...)"
  - "list_metabolites (per-row `transporter_gene_count > 0`) → genes_by_metabolite(metabolite_ids=[...], organism=..., evidence_sources=['transport']) — distinct genes in the transport rows, summed over organisms, equal that count"
  - "differential_expression_by_gene(...) → top hits → metabolites_by_gene(locus_tags=...) → genes_by_metabolite for the symmetric metabolite-anchored view"
  - "Workflow A (N-source): list_metabolites(elements=['N']) → genes_by_metabolite(metabolite_ids=[N-bearing IDs], organism=...) for catalysts + transporters"
  - "Workflow B (cross-feeding): genes_by_metabolite called once per organism on the same metabolite_ids; intersect/diff locus_tag result sets client-side"
  # downstream from rows
  - "genes_by_metabolite → top_genes → differential_expression_by_gene(locus_tags=top_genes_locus_tags, organism=...) for transcriptional response"
  - "genes_by_metabolite → top_genes (transport_substrate_resolution='resolved', high tcdb_evidence_score_max) → gene_overview(locus_tags=...) then metabolites_by_gene for the gene's full substrate set"
  - "genes_by_metabolite → top_genes → gene_overview(locus_tags=...) for richer per-gene routing context"
  # downstream from envelope
  - "genes_by_metabolite → top_tcdb_families → genes_by_ontology(ontology='tcdb', term_ids=[top_tcdb_families[i].tcdb_family_id], organism=...) for sibling genes in the same family"
  - "genes_by_metabolite → transport rows → gene_ontology_terms(locus_tags=[...], ontology='tcdb', organism=...) to see every TCDB family a gene is attached to, including ancestors superseded in the rows here"
  - "genes_by_metabolite → top_reactions → genes_by_ontology(ontology='ec', term_ids=[ec_number], organism=...) for genes in adjacent reactions"
  - "genes_by_metabolite → top_reactions / top_genes → pathway_enrichment for KEGG-pathway context"

mistakes:
  - >-
    Read transport evidence as a three-level trust ladder, top down.
    (1) `tcdb_evidence_score` (row) / `tcdb_evidence_score_max` (gene, in
    `top_genes`) — how corroborated the gene × family call is. Rank by it,
    never filter by it; 0 means an uncorroborated hit, not an absent call
    (absent is `tcdb_evidence_score_max = None`). (2) Gene-level
    `transport_substrate_resolution` in `top_genes` — `family_inferred`
    means the gene's substrate breadth is reachability through a lumping
    family, not capability; `resolved` means AT LEAST ONE of the gene's
    deepest attachments is non-lumping, not all of them — a gene attached
    at both a specific family and the ABC superfamily is `resolved` and
    still carries the superfamily rollup. (3) Per-row `substrate_depth` —
    `most_specific` is the most specific SURVIVING transporter node for
    this substrate relative to the gene-pruned hierarchy; it can be a family
    node (nitrite via tcdb:2.A.16) and it is not a curation level.
    `inherited` rows came down from an ancestor's substrate set.
  - >-
    When the auto-warning fires (most transport rows are `inherited`),
    choose by question shape: `substrate_depth=['most_specific']` for
    conservative casts (cross-organism inference); no filter for
    broad-screen candidate enumeration (N-source DE), where inherited
    rows on real uptake genes are the biology you want. Both depths are
    annotations, neither is ground truth — see `docs://guide/conventions`.
  - >-
    Transport rows are deepest-attachment projections. A gene attached to
    a TCDB family AND to one of that family's descendants contributes rows
    only through the descendant; the ancestor's substrate rollup is
    intentionally absent. Consequently distinct genes across the transport
    rows (summed over organisms) equal `list_metabolites.transporter_gene_count`
    and, gene-side, distinct metabolites equal
    `gene_overview.transported_metabolite_count`. To see a gene's full
    family membership including superseded ancestors, use
    `gene_ontology_terms(ontology='tcdb')`.
  - >-
    Every result row has the same key set — cross-arm fields are explicitly
    `None` on rows from the other arm (metabolism rows have
    `substrate_depth`/`tcdb_evidence_score`/`tcdb_family_id`/`tcdb_family_name`
    = None; transport rows have `reaction_id`/`reaction_name`/`ec_numbers`/`mass_balance`
    = None). Use `row['substrate_depth']` (KeyError-free) rather than
    `row.get('substrate_depth')` if the difference matters.
  - >-
    Reaction-arm rows are NOT directional — KG reactions carry neither a
    substrate-vs-product role on `Reaction_has_metabolite` nor an
    `is_reversible` flag. Read `evidence_source='metabolism'` rows as
    'gene catalyses a reaction *involving* this metabolite,' never as
    'produces X' / 'consumes Y' / 'reversibly interconverts'. The KG
    limitation is permanent (KEGG lacks both upstream).
  - >-
    Filtering by `ec_numbers` does NOT restrict to metabolism only.
    Per-arm filter scope: `ec_numbers` and `mass_balance` narrow the
    metabolism arm WHERE; transport rows are returned UNCHANGED (no
    soft-exclude). Symmetrically, `substrate_depth` narrows transport
    only and metabolism rows are unaffected. To restrict to one arm, set
    `evidence_sources=['metabolism']` (or `['transport']`) explicitly.
    `metabolite_pathway_ids` and `gene_categories` are the only filters
    that narrow both arms uniformly.
  - >-
    Single-organism enforced (mirrors `differential_expression_by_gene`).
    There is no `organisms` list. For cross-organism / cross-feeding work,
    call once per organism with the same metabolite_ids and combine
    locus_tag result sets client-side (Workflow B).
  - >-
    `'metabolomics'` is NOT accepted in `evidence_sources` here — the
    Pydantic Literal allows only `('metabolism', 'transport')`. The
    metabolomics path (`MetaboliteAssay → Metabolite`) has no Gene anchor,
    so a metabolomics-only metabolite returns no rows from this tool.
    To inspect measurement evidence, use `list_metabolite_assays` /
    `assays_by_metabolite` instead. Same `_VALID_EVIDENCE_SOURCES`
    validator pattern as `list_metabolites`, intentionally divergent
    value set per the tool's biology.
  - >-
    TCDB-class filtering does NOT belong here. There is no
    `tcdb_class_ids` parameter. TCDB is a first-class ontology — for
    "all genes in TCDB class 3.A.1 (ABC superfamily) for organism X", route
    through `genes_by_ontology(ontology='tcdb', term_ids=['tcdb:3.A.1'],
    organism=...)`. From here the drill-out path is `top_tcdb_families[i].tcdb_family_id`
    → `genes_by_ontology(ontology='tcdb', term_ids=[that_id], organism=...)`.
  - >-
    `not_found.metabolite_ids` vs `not_matched`. `not_found.metabolite_ids`
    = IDs that don't exist as a Metabolite node at all (typo, wrong prefix,
    ChEBI ID not in our KG). `not_matched` = IDs whose Metabolite exists
    but produced zero rows in this organism slice under the active filters
    (e.g. transport-only metabolite curated for non-MED4 strains). Don't
    conflate them — `not_matched` may go to zero by relaxing filters or
    swapping organism; `not_found` won't.
  - >-
    When the result is dominated by ATP / ADP / NADH / NADPH / H2O
    (currency cofactors that catalysts and transporters touch ubiquitously),
    pass `exclude_metabolite_ids=[<kegg.compound:Cxxxxx>]` to strip them.
    Set-difference semantics with `metabolite_ids` — exclude wins on overlap
    (silent). Per-arm scope: exclude applies on BOTH metabolism + transport
    arms (mirrors `metabolite_ids`). KG namespace is `kegg.compound:` (not
    `chebi:`).
  - >-
    Transport rows are direction-agnostic. The `Tcdb_family_transports_metabolite`
    edge does not distinguish substrate from product, and the metabolism
    arm's `Reaction_has_metabolite` edge doesn't either (KEGG equation
    order is arbitrary). To distinguish substrate vs product, layer
    transcriptional evidence (`differential_expression_by_gene`) and
    functional annotation (`gene_overview` Pfam / KEGG KO names like
    `*-synthase` vs `*-permease`).
  - wrong: "genes_by_metabolite(metabolite_ids=[...], organism=..., substrate_depth=['substrate_confirmed'])  # retired value — raises with a rename pointer"
    right: "genes_by_metabolite(metabolite_ids=[...], organism=..., substrate_depth=['most_specific'])  # valid values: most_specific, inherited"
  - "See `docs://analysis/metabolites` for the 3 source pipelines decision tree (metabolism / transport / metabolomics) and the transport trust ladder, and `docs://guide/concepts` for the chemistry layer overview."
