  - title: Summary for MED4 only
    call: list_experiments(summary=True, organism="MED4")

  - title: Browse coculture experiments with Alteromonas
    call: list_experiments(treatment_type=["coculture"], coculture_partner="Alteromonas")

  - title: Time-course nitrogen experiments in MED4
    call: list_experiments(organism="MED4", treatment_type=["nitrogen"], time_course_only=True)
    note: "treatment_type values are short nouns from a live vocabulary ('nitrogen', not 'nitrogen_stress') — an unknown value returns 0 rows, not an error."

  - title: From publication to expression data
    steps: |
      Step 1: list_publications(search_text="Biller")
              → get DOI from results

      Step 2: list_experiments(publication_dois=["10.1038/ismej.2016.70"])
              → browse experiments, pick experiment_id

      Step 3: differential_expression_by_gene(organism="MED4", experiment_ids=["..."])
              → get gene-level results

  - title: Orient then drill down
    steps: |
      Step 1: list_experiments(summary=True)
              → read total_entries, then by_organism / by_treatment_type / by_omics_type
                to see where the bulk of the experiments sit (MED4 is the best-covered
                organism; carbon and coculture are the largest treatment groups)

      Step 2: list_experiments(organism="MED4", treatment_type=["coculture"])
              → browse the MED4 coculture experiments

      Step 3: differential_expression_by_gene(organism="MED4", experiment_ids=["..."])
              → get gene-level results

  - title: Fetch metadata for a known experiment_id list
    call: list_experiments(experiment_ids=["10.1101/2025.11.24.690089_coculture_prochlorococcus_med4_hot1a3_rnaseq", "10.1101/2025.11.24.690089_coculture_alteromonas_hot1a3_med4_rnaseq"], verbose=True)
    note: "experiment_ids are the KG's Experiment.id strings (DOI-prefixed); copy them from an earlier list_experiments result — unknown ids land in not_found."

