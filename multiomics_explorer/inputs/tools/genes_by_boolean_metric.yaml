  - title: DE → top hits → boolean flag intersection
    steps: |
      Step 1: differential_expression_by_gene(organism="MED4", significant_only=True, limit=20)
              → extract `locus_tag` from each result row (top-20 |log2FC|).

      Step 2: genes_by_boolean_metric(
                metric_types=["vesicle_proteome_member"],
                locus_tags=[<those 20 locus_tags>])
              → which DE hits are also vesicle-proteome members?
                Per-row `value="flagged"` confirms the flag; envelope
                `total_matching` shows the intersection size.

      Step 3 (drill-down): gene_overview(locus_tags=[<intersected genes>])
              → routing context for the genes that are both DE-significant
                AND vesicle-detected.

verbose_fields:
  - name
  - value_kind
  - rankable
  - has_p_value
  - organism_name
  - metric_type
  - field_description
  - unit
  - compartment
  - experiment_id
  - publication_doi
  - treatment_type
  - background_factors
  - treatment
  - light_condition
  - experimental_context
  - gene_function_description
  - gene_summary

chaining:
  - "list_derived_metrics(value_kind='boolean') → genes_by_boolean_metric(metric_types=[...]) → gene_overview / genes_by_function"
  - "differential_expression_by_gene → top hits → genes_by_boolean_metric(metric_types=[...], locus_tags=hits)"
  - "genes_by_boolean_metric (no organism filter) → split via envelope by_organism for cross-strain comparison"

mistakes:
  - >-
    Two storage conventions coexist. 11 of 27 boolean DMs (Biller 2022,
    Voigt 2014, Hennon 2015, Steglich 2010) store `r.value="not_flagged"`
    edges, so `flag=False` returns tested-absent rows there; the rest
    (Biller 2014 / 2018, Coe 2016) are positive-only and return 0 rows for
    `flag=False`. Read `by_metric[*].false_count` before reading an absent
    gene as "not flagged" rather than "not assessed"; `dm_false_count` is
    the full-DM precomputed twin (0 on positive-only DMs). Contrast
    `metabolites_by_flags_assay`, whose edges always store both states.
  - >-
    Sparse `rankable` / `has_p_value` echoes. Both are always `False` on
    every row from boolean DMs in the current KG — kept for cross-tool
    row-shape consistency with `genes_by_numeric_metric`, not because this
    tool reads them as a meaningful signal. Don't gate downstream logic on
    them.
  - wrong: genes_by_boolean_metric(derived_metric_ids=['derived_metric:...:damping_ratio'])  # numeric DM
    right: genes_by_boolean_metric(metric_types=['vesicle_proteome_member'])  # discover IDs via list_derived_metrics(value_kind='boolean') first
  - "See `docs://analysis/derived_metrics` for the DM family overview. Note: `flag=False` returns rows only on DMs that store `not_flagged` edges (11 of 27); metabolomics `metabolites_by_flags_assay` always stores both states."
