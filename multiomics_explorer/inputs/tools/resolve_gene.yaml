# Human-authored content for resolve_gene about page.
# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

examples:
  - title: Resolve by locus_tag
    call: resolve_gene(identifier="PMM0001")
    response: |
      {
        "total_matching": 1,
        "by_organism": [{"organism_name": "Prochlorococcus MED4", "count": 1}],
        "returned": 1,
        "offset": 0,
        "truncated": false,
        "results": [
          {
            "locus_tag": "PMM0001",
            "gene_name": "dnaN",
            "product": "DNA polymerase III, beta subunit",
            "organism_name": "Prochlorococcus MED4"
          }
        ]
      }

  - title: Resolve gene name across organisms
    call: resolve_gene(identifier="dnaN")
    response: |
      {
        "total_matching": 43,
        "by_organism": [
          {"organism_name": "Alteromonas (MarRef v6)", "count": 1},
          {"organism_name": "Alteromonas macleodii AD45", "count": 1},
          {"organism_name": "Alteromonas macleodii ATCC27126", "count": 1},
          {"organism_name": "Alteromonas macleodii BGP6", "count": 1},
          {"organism_name": "Alteromonas macleodii BS11", "count": 1},
          ...
        ],
        "returned": 5,
        "offset": 0,
        "truncated": true,
        "results": [
          {
            "locus_tag": "DEH24_01275",
            "gene_name": "dnaN",
            "product": "DNA polymerase III subunit beta",
            "organism_name": "Alteromonas (MarRef v6)"
          },
          {
            "locus_tag": "AMBAS45_00010",
            "gene_name": "dnaN",
