  - title: Find coculture studies
    call: list_publications(treatment_type=["coculture"])

  - title: Chaining to experiments
    steps: |
      Step 1: list_publications(organism="MED4")
              → find papers studying MED4

      Step 2: list_experiments(publication_dois=[result["doi"]])
              → drill into experiments from a specific paper

      Step 3: genes_by_function(search_text="photosystem", organism="MED4")
              → find genes of interest

  - title: Fetch metadata for a known DOI list
    call: list_publications(publication_dois=["10.1038/ismej.2016.70", "10.1101/2025.11.24.690089"], verbose=True)

