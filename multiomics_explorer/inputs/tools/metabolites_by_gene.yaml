verbose_fields:
  - gene_category
  - metabolite_inchikey
  - metabolite_smiles
  - metabolite_mnxm_id
  - metabolite_hmdb_id
  - reaction_mnxr_id
  - reaction_rhea_ids
  - tcdb_level_kind
  - tc_class_id

chaining:
  # upstream — gene-set producers
  - "differential_expression_by_gene(organism=..., direction='up') → metabolites_by_gene(locus_tags=DE_genes, organism=..., metabolite_elements=['N']) (Workflow A — N-source marquee)"
  - "genes_in_cluster(cluster_ids=...) → metabolites_by_gene(locus_tags=cluster_genes, organism=...) (Workflow C — cluster chemistry characterization)"
  - "genes_by_function(search_text=..., organism=...) → metabolites_by_gene(locus_tags=function_hit_genes, organism=...) (Workflow C variant — function-search chemistry)"
  - "gene_overview(locus_tags=[...]) → per-row reaction_count/catalyzed_metabolite_count > 0 → metabolites_by_gene(locus_tags=chemistry_genes, organism=...)"
  - "gene_overview(locus_tags=[...]) → per-row transport_substrate_resolution='resolved' (read tcdb_evidence_score_max first) → metabolites_by_gene(locus_tags=[...], organism=..., evidence_sources=['transport']) — distinct metabolites in the rows equal transported_metabolite_count"

  # downstream from envelope — top_metabolites
  - "metabolites_by_gene → top_metabolites → list_metabolites(metabolite_ids=[top_metabolite_ids]) for richer per-metabolite cross-refs (mass, formula, full pathway names)"
  - "metabolites_by_gene → top_metabolites → list_metabolites(metabolite_ids=[top_metabolite_ids], organism_names=[partner_organism]) for cross-organism presence (cross-feeding seed)"
  - "metabolites_by_gene → top_metabolites → genes_by_metabolite(metabolite_ids=[top_metabolite_ids], organism=PARTNER_ORGANISM) (cross-feeding bridge — catalysts + transporters in partner)"
  - "metabolites_by_gene → stereo_relatives → genes_by_metabolite(metabolite_ids=[generic substrate id], organism=..., include_stereo_forms=True) to join this gene's generic-form transport with the specific form's catalysts"

  # downstream from envelope — top_metabolite_pathways (chemistry-pathway-filtered)
  - "metabolites_by_gene → top_metabolite_pathways → list_metabolites(pathway_ids=[metabolite_pathway_id]) for the full metabolite roster of the pathway (not just gene-set hits)"
  - "metabolites_by_gene → top_metabolite_pathways → genes_by_ontology(ontology='kegg', term_ids=[metabolite_pathway_id], organism=...) for gene-KO-mediated pathway annotations (different surface — see top_metabolite_pathways naming disambiguation)"
  - "metabolites_by_gene → top_metabolite_pathways → pathway_enrichment(...) when gene-set hypothesis test is the goal"

  # downstream from envelope — top_reactions / top_tcdb_families
  - "metabolites_by_gene → top_reactions → genes_by_ontology(ontology='ec', term_ids=[ec_number], organism=...) for genes in adjacent reactions"
  - "metabolites_by_gene → top_tcdb_families → genes_by_ontology(ontology='tcdb', term_ids=[tcdb_family_id], organism=...) for sibling genes in the same family"
  - "metabolites_by_gene → by_gene (transport_substrate_resolution='family_inferred') → gene_ontology_terms(locus_tags=[...], ontology='tcdb', organism=...) to see every TCDB family the gene is attached to, including ancestors superseded in the rows here"

  # downstream from not_matched (annotation-context drill-out)
  - "metabolites_by_gene → not_matched (locus_tags with no chemistry edges) → gene_overview(locus_tags=not_matched) for annotation context (most are richly-annotated non-chemistry genes — DNA gyrase, signaling, etc. — not annotation gaps)"

mistakes:
  - >-
    Gene-anchored (locus_tags → metabolites). The metabolite-anchored
    mirror is `genes_by_metabolite` (metabolite → genes); both share the
    same row class, discriminators and per-arm filter scope.
  - >-
    A transporter's substrates are usually the generic, stereo-unspecified
    node ('Cysteine'), because TCDB names them that way; the enzymes sit on
    the specific form ('L-Cysteine'). Stereo forms are separate nodes and no
    count combines across them, so don't conclude "no enzyme uses what this
    gene imports" from these rows. Read envelope `stereo_relatives` (keyed by
    result metabolite; counts cover the whole organism, not your input genes)
    and per-row `stereo_relative_ids`, then route to
    `genes_by_metabolite(..., include_stereo_forms=True)`. Class terms and
    ring vs open-chain forms are never linked, so no hint is not proof of no
    related compound.
  - >-
    Single-organism enforced (mirrors `differential_expression_by_gene` and
    `genes_by_metabolite`). There is no `organisms` list. For
    cross-organism / cross-feeding work: call MBG once on
    the focal organism, take `top_metabolites`, then route to
    `genes_by_metabolite(metabolite_ids=[...], organism=partner)` (or
    `list_metabolites(metabolite_ids=[...], organism_names=[partner])` for
    presence-only).
  - >-
    `'metabolomics'` is NOT accepted in `evidence_sources` here — the
    Pydantic Literal allows only `('metabolism', 'transport')`. The
    metabolomics path (`MetaboliteAssay → Metabolite`) has no Gene anchor,
    so a metabolomics-only metabolite contributes no rows from this tool.
    For measurement evidence, use `list_metabolite_assays` /
    `metabolites_by_quantifies_assay` / `metabolites_by_flags_assay`.
    Same divergence as `genes_by_metabolite`.
  - >-
    Transport trust reads top down, exactly as on `genes_by_metabolite`:
    (1) `tcdb_evidence_score` (row) / `tcdb_evidence_score_max` (in
    `by_gene`) — rank by it, never filter; (2) gene-level
    `transport_substrate_resolution` in `by_gene` and repeated on every
    transport row of that gene (`family_inferred` = reachability through
    a lumping family, not capability; `resolved` = at least one
    non-lumping deepest attachment; metabolism rows read `None`); (3)
    per-row `substrate_depth` (`most_specific` = most specific SURVIVING
    node in the gene-pruned hierarchy, which can be a family node;
    `inherited` = came down from an ancestor's substrate set). When the
    auto-warning fires, `substrate_depth=['most_specific']` does NOT remove
    `family_inferred` genes (PMM0913 keeps 217 such rows) — only the
    gene-level resolution guards against reading their substrates. Full
    ladder and the depth-filter decision (conservative cast vs broad
    screen): `docs://analysis/metabolites`.
  - >-
    Transport rows are deepest-attachment projections. A gene attached to
    a TCDB family AND to one of that family's descendants contributes rows
    only through the descendant; the ancestor's substrate rollup is
    intentionally absent. Consequently distinct metabolites across a gene's
    transport rows equal `gene_overview.transported_metabolite_count`
    (PMM0392: 12, not the ABC-superfamily plateau), and metabolite-side
    distinct genes equal `list_metabolites.transporter_gene_count`. To see
    a gene's full family membership including superseded ancestors, use
    `gene_ontology_terms(ontology='tcdb')`.
  - >-
    Every result row has the same key set — cross-arm fields are explicitly
    `None` on rows from the other arm (metabolism rows have
    `substrate_depth`/`tcdb_evidence_score`/`transport_substrate_resolution`/`tcdb_family_id`/`tcdb_family_name`
    = None; transport rows have `reaction_id`/`reaction_name`/`ec_numbers`/`mass_balance`
    = None). Use `row['substrate_depth']` (KeyError-free) rather than
    `row.get('substrate_depth')` if the difference matters.
  - >-
    Reaction-arm rows are NOT directional — KG reactions carry neither a
    substrate-vs-product role on `Reaction_has_metabolite` nor an
    `is_reversible` flag. Read `evidence_source='metabolism'` rows as
    'gene catalyses a reaction *involving* this metabolite,' never as
    'produces X' / 'consumes Y' / 'reversibly interconverts'. The KG
    limitation is permanent (KEGG lacks both upstream).
  - >-
    `metabolite_elements` never matches a metabolite with no formula (empty
    `elements`). These are mostly generic classes such as 'amino acid',
    'dipeptide' or 'Polyamine', so an element filter can silently drop
    N-bearing transport substrates. When the filter is set, the envelope
    reports the loss: `no_formula_excluded` (rows) and
    `no_formula_excluded_metabolites` (distinct metabolites) that pass every
    other filter but have no formula, plus a `warnings` entry. Re-run without
    `metabolite_elements` to inspect them.
  - >-
    `by_element` envelope is presence-only — count of distinct metabolites
    containing each element at all. NOT stoichiometric (atom counts live in
    `metabolite.formula`); NOT mass-balanced (KG `Reaction_has_metabolite`
    is undirected and carries no substrate/product role).
  - >-
    There is no `top_genes` envelope field. The per-gene rollup IS `by_gene`
    (one entry per input locus_tag, populated identically in summary and detail
    modes — `rows` / `metabolite_count` / `reaction_count` / `transporter_count`
    / `metabolism_rows` / `transport_most_specific_rows` /
    `transport_inherited_rows` / `transport_substrate_resolution` /
    `tcdb_evidence_score_max`). The compound-anchored counterpart
    `top_metabolites` exists (sorted by gene_count); there's no symmetric
    `top_genes` because gene-anchored aggregation already lives in `by_gene`.
    Inspect the actual response shape before assuming a field — don't
    extrapolate from `genes_by_metabolite.top_genes` (different tool, different
    shape) or `top_*` patterns on other tools.
  - >-
    `gene_categories` filter is partially redundant with `locus_tags` input
    (since the input already constrains the gene set). It's useful only as
    further narrowing within a broad batch — e.g. `locus_tags=DE_genes,
    gene_categories=['Transport and binding']` to slice DE chemistry to
    transport-classified genes only. Don't use it as the primary anchor.
  - >-
    `ec_numbers` and `mass_balance` are metabolism-arm-only filters — they
    DO NOT suppress transport rows. Transport rows pass through unchanged.
    To restrict to metabolism alone, combine with
    `evidence_sources=['metabolism']`. Symmetrically, `substrate_depth`
    narrows transport rows only and metabolism rows are unaffected. Per-arm
    filter scope is predictable + composable; it is NOT soft-exclude.
    `metabolite_elements`, `metabolite_ids`, `metabolite_pathway_ids`, and
    `gene_categories` are the only filters that narrow both arms uniformly.
  - >-
    `top_metabolite_pathways` here means *KEGG pathways the gene set's
    chemistry reaches* (via `Reaction_in_kegg_pathway` +
    `Metabolite_in_pathway`). These are NOT the same as gene-KO-mediated
    pathway annotations (where pathway membership is asserted by the gene's
    KO assignment) — those live in `genes_by_ontology(ontology='kegg',
    term_ids=[...], organism=...)`. The two are distinct surfaces:
    chemistry-reach (this tool) vs KO-annotation (`genes_by_ontology`). For
    metabolic pathway analysis with a hypothesis test, use
    `pathway_enrichment` instead.
  - >-
    `metabolite_elements` is presence-only AND-of (not formula substring).
    `['N']` keeps metabolites whose `Metabolite.elements` Hill-parsed list
    contains 'N'. `['N', 'P']` requires BOTH N and P. Never substring-match
    on `formula` — Hill notation has element-clash footguns: `'Cl'`
    contains `'C'`, `'Na'` contains `'N'`. Use the `metabolite_elements`
    filter, never grep `formula`.
  - >-
    Use `summary=True` for batch DE inputs (50+ locus_tags). Detail rows
    can exceed 1,000 quickly even after the depth-tier sort; the
    envelope rollups (top_metabolites, top_metabolite_pathways,
    top_reactions, top_tcdb_families, by_element, by_gene,
    top_gene_categories) are the actually-useful artifact at that scale.
  - >-
    `not_found.locus_tags` vs `not_matched`. `not_found.locus_tags` =
    locus_tags that don't resolve to any Gene in the requested organism
    (typo, wrong organism, gene removed in KG rebuild). `not_matched` =
    locus_tags that DO resolve to a Gene but have zero chemistry edges
    (no `Gene_catalyzes_reaction` AND no `Gene_has_tcdb_family`). Most MED4
    genes fall into the `not_matched` bucket (roughly 1,170 of MED4's
    ~1,970 genes carry no chemistry edge) — most are richly-annotated
    non-chemistry genes (DNA gyrase, queG, signaling modules), not
    annotation gaps. Pivot via
    `gene_overview(locus_tags=not_matched)` for annotation context.
  - >-
    When `top_metabolites` is dominated by ATP / ADP / NADH / NADPH / H2O,
    pass `exclude_metabolite_ids=[<kegg.compound:Cxxxxx>]` to strip the
    currency-cofactor noise. Set-difference semantics with
    `metabolite_ids` — exclude wins on overlap (silent). Per-arm scope:
    exclude applies on BOTH metabolism + transport arms (mirrors
    `metabolite_ids`). KG namespace is `kegg.compound:` (not `chebi:`).
  - >-
    Detail rows are direction-agnostic. The transport edge
    (`Tcdb_family_transports_metabolite`) does not distinguish substrate
    from product, and the metabolism arm's `Reaction_has_metabolite`
    edge doesn't either (KEGG equation order is arbitrary). To distinguish,
    layer transcriptional evidence (`differential_expression_by_gene`) and
    functional annotation (`gene_overview` Pfam / KEGG KO names like
    `*-synthase` vs `*-permease`).
  - wrong: "metabolites_by_gene(locus_tags=[...], organism=..., substrate_depth=['family_inferred'])  # retired value — raises with a rename pointer"
    right: "metabolites_by_gene(locus_tags=[...], organism=..., substrate_depth=['inherited'])  # valid values: most_specific, inherited"
  - wrong: "metabolites_by_gene(metabolite_ids=['C00064'])  # then treating `C00064` in `not_found` as 'no such metabolite'"
    right: |
      Metabolite IDs on `metabolite_ids` / `exclude_metabolite_ids` are normalised and
      looked up in every identifier the metabolite carries before the query runs:
      `C00064` / `kegg.compound:c00064` → `kegg.compound:C00064`, `CHEBI:17234` /
      `17234` → `chebi:17234`; `HMDB0000122`, `MNXM732398` and bare InChIKeys resolve
      the same way. Retired ids of merged or re-keyed nodes resolve to the surviving
      node (`chebi:14654` → nitrate `kegg.compound:C00244`). Every input that isn't
      already canonical is listed in envelope `resolved_aliases`
      (`{input: [canonical, ...]}`). A removed compound whose measurements moved to
      another compound, and a chemical-role id (`chebi:10004`, 'vitamin (role)'),
      stay verbatim in `not_found` with a `warnings` entry naming the replacement or
      the role. Other unresolved inputs stay verbatim in `not_found` in the form you
      passed. Exclude-wins-on-overlap is computed on the canonical IDs, so currency-cofactor exclude lists in either form behave identically.
  - "See `docs://analysis/metabolites` for the 3 source pipelines decision tree (metabolism / transport / metabolomics) and the transport trust ladder, and `docs://guide/concepts` for the chemistry layer overview."
  - "`not_found.organism` is set when the `organism` name resolves to zero organisms — check it before reading an empty result as 'no chemistry here'."
  - "Long-tail genes (ABC-only annotations) can fill `limit` on their own: narrow with `substrate_depth=['most_specific']`, or page with `offset`."
