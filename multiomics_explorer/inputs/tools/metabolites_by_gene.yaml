# Human-authored content for metabolites_by_gene about page.
# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

examples:
  - title: Single-gene drill-down — resolved transporter (Workflow D)
    call: metabolites_by_gene(locus_tags=["PMM0392"], organism="Prochlorococcus MED4", evidence_sources=["transport"])
    # Workflow D: single-gene mode. Envelope rollups are mostly noise at n=1;
    # detail rows + total_matching do the work. PMM0392 (ECF transporter
    # energizing module) is attached to the ABC superfamily AND to seven
    # of its subfamilies, so rows come only from the subfamilies
    # (deepest-attachment projection): 13 distinct metabolites, matching
    # `gene_overview.transported_metabolite_count`. `by_gene[0]` reads
    # transport_substrate_resolution='resolved', tcdb_evidence_score_max=0.8,
    # and every one of the 13 transport rows repeats
    # transport_substrate_resolution='resolved' — the gene's value, not a
    # per-substrate one (substrate_depth is the per-row fact).

  - title: Single-gene drill-down — superfamily-only gene (reachability, not capability)
    call: metabolites_by_gene(locus_tags=["PMM0913"], organism="Prochlorococcus MED4", limit=5)
    # PMM0913 (salY) is one of the ABC-superfamily-only MED4 genes: its
    # deepest TCDB attachment IS the superfamily (tcdb:3.A.1), so
    # `by_gene[0]` reads transport_substrate_resolution='family_inferred'
    # (score_max 0.8) and the auto-warning fires — 518 transport rows of
    # reachability through a lumping family, not capability. Note the
    # split: 301 rows are inherited, but 217 are most_specific AT the
    # superfamily — substrates no kept child of tcdb:3.A.1 carries. That
    # is a superfamily-level position, not a subfamily call, so
    # `substrate_depth=['most_specific']` does NOT remove this gene (it
    # still returns 217 rows, no warning). The gene-level resolution is
    # the only guard against reading its substrates. `limit=5` caps the
    # row blowup.

  - title: Urease subunits (canonical detail-row example)
    call: metabolites_by_gene(locus_tags=["PMM0963", "PMM0964", "PMM0965"], organism="Prochlorococcus MED4", limit=5)
    # 12 metabolism rows total (3 ureA/B/C × R00131 × 4 metabolites
    # {Urea, H2O, CO2, NH3}); zero transport rows because the ureA/B/C trio
    # carry no Gene_has_tcdb_family edges. Detail rows surface the catalysis
    # triplets; envelope `top_metabolites` ranks {Urea, H2O, CO2, NH3} by
    # gene reach, `top_metabolite_pathways` (chemistry-pathway-filtered to
    # pathways with at least 3 reactions in the KG) ranks Nitrogen cycle,
    # Cyanoamino acid metabolism, Biotin metabolism, Calvin cycle, Nitrogen
    # metabolism, Arginine biosynthesis, Alanine/aspartate/glutamate
    # metabolism (no signaling/disease pathways pollute the top 10),
    # `by_element` returns [{H,3},{O,3},{C,2},{N,2}].

  - title: Workflow A (N-source marquee) — DE batch with element filter
    steps: |
      Step 1: differential_expression_by_gene(
                organism="Prochlorococcus MED4",
                experiment_ids=[<N-limitation experiment IDs>],
                direction="up", significant_only=True,
              )
              → DE gene set (~50-200 locus_tags)

      Step 2: metabolites_by_gene(
                locus_tags=DE_gene_set,
                organism="Prochlorococcus MED4",
                metabolite_elements=["N"],
                summary=True,                 # batch DE → envelope is the artifact
              )
              → top_metabolites ranks N-bearing compounds by gene reach;
                top_metabolite_pathways concentrates Nitrogen metabolism,
                Arginine biosynthesis, Alanine/aspartate/glutamate metabolism;
                by_element confirms N-presence dominance;
                by_gene[].transport_substrate_resolution separates genes whose
                N-substrate breadth is a real call from superfamily reachability.

      Step 3 (optional): list_metabolites(metabolite_ids=[top_N_metabolite_ids])
              → cross-refs, mass, formula, full pathway names.

  - title: Workflow C (cluster characterization) — chemistry of a co-expressed cluster
    steps: |
      Step 1: genes_in_cluster(cluster_ids=[<cluster_id>])
              → gene set (~10-100 locus_tags)

      Step 2: metabolites_by_gene(
                locus_tags=cluster_genes,
                organism="Prochlorococcus MED4",
                summary=True,
              )
              → top_metabolite_pathways = "what pathways does this set sit in"
                by_element = C/N/P/S signature
                top_metabolites = specific compounds the set's chemistry hits

      Step 3 (optional): list_metabolites(pathway_ids=[<top_metabolite_pathway_id>])
              → full metabolite roster of the pathway (not just gene-set hits).

  - title: Cross-feeding workflow — MBG → GBM bridge
    steps: |
      Step 1: differential_expression_by_gene(
                organism="Prochlorococcus MED4",
                experiment_ids=[<coculture experiment IDs>],
                direction="up", significant_only=True,
              )
              → MED4 coculture-up DE gene set

      Step 2: metabolites_by_gene(
                locus_tags=MED4_DE_genes,
                organism="Prochlorococcus MED4",
                summary=True,
              )
              → top_metabolites = "metabolites my upregulated MED4 genes deal in"

      Step 3: genes_by_metabolite(
                metabolite_ids=[id for id in top_metabolites],
                organism="Alteromonas macleodii MIT1002",
              )
              → catalysts and transporters for those metabolites in the
                partner organism. Intersect / diff client-side to seed
                cross-feeding hypotheses.

  - title: Currency-cofactor strip — exclude ATP/ADP/NADH/NADPH/H2O on a chemistry rollup
    call: |
      metabolites_by_gene(
        locus_tags=["PMM0963", "PMM0964", "PMM0965"],
        organism="Prochlorococcus MED4",
        exclude_metabolite_ids=[
          "kegg.compound:C00002",
          "kegg.compound:C00008",
          "kegg.compound:C00004",
          "kegg.compound:C00005",
          "kegg.compound:C00001",
        ],
        summary=True,
      )
    # Cofactor IDs above: ATP (C00002), ADP (C00008), NADH (C00004),
    # NADPH (C00005), H2O (C00001). Set-difference semantics with
    # `metabolite_ids` — exclude wins on overlap (silent). Per-arm scope:
    # the exclude applies on BOTH the metabolism arm
    # (Reaction_has_metabolite) and the transport arm
    # (Tcdb_family_transports_metabolite), mirroring `metabolite_ids`. On
    # the urease trio, this drops H2O from the {Urea, H2O, CO2, NH3}
    # canonical envelope.

  - title: Conservative-cast transporter slice (mute the rollup blowup)
    call: metabolites_by_gene(locus_tags=["PMM0434", "PMM0913"], organism="Prochlorococcus MED4", substrate_depth=["most_specific"], evidence_sources=["transport"], limit=5)
    # Both inputs are ABC-superfamily-only genes: the unfiltered transport
    # call returns 1036 rows (518 each: 301 inherited + 217 most_specific
    # at tcdb:3.A.1) and trips the auto-warning because both read
    # transport_substrate_resolution='family_inferred'. Pairing
    # `substrate_depth=['most_specific']` AND `evidence_sources=['transport']`
    # drops the inherited rows but still returns 434 rows (217 per gene)
    # with no warning — the filter mutes the rollup, it does not judge the
    # genes. most_specific at a lumping superfamily is a superfamily-level
    # position, not a subfamily call; read `by_gene[].transport_substrate_resolution`
    # before trusting any of these substrates. Useful diagnostic for batch
    # DE inputs that mix superfamily-only genes with resolved transporters.
    # See `docs://analysis/metabolites` — both depths are annotations,
    # neither is ground truth.

  - title: Stereo hint — a cysteine transporter's generic substrates point at their specific forms
