# Human-authored content for metabolites_by_gene about page.
# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

examples:
  - title: Single-gene drill-down — a direct transporter
    call: metabolites_by_gene(locus_tags=["PMM0372"], organism="Prochlorococcus MED4", evidence_sources=["transport"])
    # Single-gene mode. Envelope rollups are mostly noise at n=1;
    # detail rows + total_matching do the work. PMM0372 (cynD) has two
    # tcdb_gate='direct' calls on sibling TC systems: a rank-1 DIAMOND best
    # hit on tcdb:3.A.1.16.2 (bispecific cyanate/nitrite, 59.2% identity)
    # and an eggNOG call on tcdb:3.A.1.16.1 (nitrate/nitrite). One row per
    # gene × system × metabolite gives 4 rows over 3 distinct metabolites
    # (nitrite appears once per system), matching
    # `gene_overview.transported_metabolite_count = 3`; `by_gene[0]` reads
    # tcdb_direct_rows=4 and tcdb_assignment_count=2. Its weak tier-3 DIAMOND
    # call on the ABC superfamily tcdb:3.A.1 never reaches a substrate.

  - title: Single-gene drill-down — superfamily-only gene (substrate unknown)
    call: metabolites_by_gene(locus_tags=["PMM0913"], organism="Prochlorococcus MED4", limit=5)
    # PMM0913 (salY) carries a usable TCDB call only on the ABC superfamily
    # tcdb:3.A.1. It points at no system, so the transport arm is empty, and
    # the family walk never starts from a node curated with over 200
    # substrates (tcdb:3.A.1 has 546). `tcdb_family_substrates_skipped` names
    # the gene and node, and the warning says the call is superfamily-level
    # with the substrate unknown. Read it as "an ABC transporter of unknown
    # substrate", not as "no transporter".

  - title: Urease subunits (canonical detail-row example)
    call: metabolites_by_gene(locus_tags=["PMM0963", "PMM0964", "PMM0965"], organism="Prochlorococcus MED4", limit=5)
    note: "12 metabolism rows (ureA/B/C × R00131 × {Urea, H2O, CO2, NH3}); no TCDB or GO rows. `by_element` = [{H,3},{O,3},{C,2},{N,2}]; `top_metabolite_pathways` ranks by gene reach and includes the KEGG global maps (ko01100, ko01110, ko01120)."

  - title: N-source batch — DE genes with an element filter
    steps: |
      Step 1: differential_expression_by_gene(
                organism="Prochlorococcus MED4",
                experiment_ids=[<N-limitation experiment IDs>],
                direction="up", significant_only=True,
              )
              → DE gene set (~50-200 locus_tags)

      Step 2: metabolites_by_gene(
                locus_tags=DE_gene_set,
                organism="Prochlorococcus MED4",
                metabolite_elements=["N"],
                summary=True,                 # batch DE → envelope is the artifact
              )
              → top_metabolites ranks N-bearing compounds by gene reach;
                top_metabolite_pathways concentrates Nitrogen metabolism,
                Arginine biosynthesis, Alanine/aspartate/glutamate metabolism;
                by_element confirms N-presence dominance;
                by_gene[].tcdb_direct_rows vs tcdb_family_rows separates genes
                TCDB placed in a system from family-level candidates (family
                rows only with include_tcdb_family_substrates=True).

      Step 3 (optional): list_metabolites(metabolite_ids=[top_N_metabolite_ids])
              → cross-refs, mass, formula, full pathway names.

  - title: Cluster chemistry — what a co-expressed cluster reaches
    steps: |
      Step 1: genes_in_cluster(cluster_ids=[<cluster_id>])
              → gene set (~10-100 locus_tags)

      Step 2: metabolites_by_gene(
                locus_tags=cluster_genes,
                organism="Prochlorococcus MED4",
                summary=True,
              )
              → top_metabolite_pathways = "what pathways does this set sit in"
                by_element = C/N/P/S signature
                top_metabolites = specific compounds the set's chemistry hits

      Step 3 (optional): list_metabolites(pathway_ids=[<top_metabolite_pathway_id>])
              → full metabolite roster of the pathway (not just gene-set hits).

  - title: Cross-feeding — metabolites_by_gene on one organism, genes_by_metabolite on the partner
    steps: |
      Step 1: differential_expression_by_gene(
                organism="Prochlorococcus MED4",
                experiment_ids=[<coculture experiment IDs>],
                direction="up", significant_only=True,
              )
              → MED4 coculture-up DE gene set

      Step 2: metabolites_by_gene(
                locus_tags=MED4_DE_genes,
                organism="Prochlorococcus MED4",
                summary=True,
              )
              → top_metabolites = "metabolites my upregulated MED4 genes deal in"

      Step 3: genes_by_metabolite(
                metabolite_ids=[id for id in top_metabolites],
                organism="Alteromonas macleodii MIT1002",
              )
              → catalysts and transporters for those metabolites in the
                partner organism. Intersect / diff client-side to seed
                cross-feeding hypotheses.

  - title: Currency-cofactor strip — exclude ATP/ADP/NADH/NADPH/H2O on a chemistry rollup
    call: |
      metabolites_by_gene(
        locus_tags=["PMM0963", "PMM0964", "PMM0965"],
        organism="Prochlorococcus MED4",
        exclude_metabolite_ids=[
          "kegg.compound:C00002",
          "kegg.compound:C00008",
          "kegg.compound:C00004",
          "kegg.compound:C00005",
          "kegg.compound:C00001",
        ],
        summary=True,
      )
    # Cofactor IDs above: ATP (C00002), ADP (C00008), NADH (C00004),
    # NADPH (C00005), H2O (C00001). Set-difference semantics with
    # `metabolite_ids` — exclude wins on overlap (silent). The exclude
    # applies to all three arms (KEGG, TCDB, GO), like `metabolite_ids`. On
    # the urease trio, this drops H2O from the {Urea, H2O, CO2, NH3}
    # canonical envelope.

  - title: Family walk — phnD (PMM0673) has no system call, so its substrates come from subfamily tcdb:3.A.1.9
    call: metabolites_by_gene(locus_tags=["PMM0673"], organism="Prochlorococcus MED4", evidence_sources=["transport"], include_tcdb_family_substrates=True)
    note: "Without the switch the transport arm is empty, and the warning says a family or subfamily call can reach substrates (`tcdb_family_substrates_not_shown` = 5 rows). phnD's usable call is eggNOG on subfamily tcdb:3.A.1.9 (PhnT, uptake); its DIAMOND hit is a weak tier-3 call on 3.A.1. The walk adds one `tcdb_route='family'` row per metabolite curated on a system under 3.A.1.9: orthophosphate, phosphonic acid, phosphite, phosphinate and Fe3+. `tcdb_family_id` = `attached_tcdb_id` = tcdb:3.A.1.9, `tcdb_substrate_system_count` counts the systems behind each row, and `tcdb_identity` is null because the call is eggNOG. These rows are candidates (a recall expansion), not substrate calls."

  - title: Curation quirk — pstS (PMM0710) reaches triphosphate only, not orthophosphate
    call: metabolites_by_gene(locus_tags=["PMM0710"], organism="Prochlorococcus MED4", evidence_sources=["transport"], include_tcdb_family_substrates=True)
    note: "pstS points directly at tcdb:3.A.1.7.6 (\"High affinity phosphate-specific transporter, PstABCS\", best hit 85.9% identity, `tcdb_calls` = all three kinds). TCDB curates that system with triphosphate only, so the one row is Triphosphate. The switch adds nothing: the family walk never starts above one of the gene's direct systems. TCDB curation is reported as-is; read `tcdb_family_name` next to the metabolite."

  - title: Stereo hint — a transporter's generic substrates point at their specific forms
    call: metabolites_by_gene(locus_tags=["PMM0065"], organism="Prochlorococcus MED4", evidence_sources=["transport"], include_tcdb_family_substrates=True, summary=True)
    note: "TCDB names substrates generically, so this gene's family rows (through subfamily tcdb:3.A.1.106) reach Cysteine (stereo form unspecified), not L-Cysteine. Envelope `stereo_relatives` is keyed by each result metabolite that has a stereo relative with MED4 genes; its counts cover the whole organism, not just PMM0065, and match `genes_by_metabolite` on the relative. Next step: `genes_by_metabolite(metabolite_ids=['kegg.compound:C00736'], organism='Prochlorococcus MED4', include_stereo_forms=True, include_tcdb_family_substrates=True)`."

  - title: GO transport rows next to TCDB — PMM0970 (urtA) in MED4
