  - title: Inherited target — murJ (PMM0261) reaches Lipid only through an ancestor GO term (go_include_ancestors=True)
    call: metabolites_by_gene(locus_tags=["PMM0261"], organism="Prochlorococcus MED4", go_include_ancestors=True)
    note: "Without the flag this gene has no GO rows (only TCDB). With it, the GO row names Lipid at `go_term_depth=1`: the gene's own term is lipid translocation, the ancestor that names the target is lipid transport (`go_axiom_term_id` / `go_axiom_term_name`). Inherited rows come after every direct row for the same gene set and widen toward broader targets, so treat them as recall."

  - title: Route agreement per gene — urtA, urtB, urtE in MED4
    call: metabolites_by_gene(locus_tags=["PMM0970", "PMM0971", "PMM0974"], organism="Prochlorococcus MED4", summary=True)
    note: "`by_evidence_source_combination` counts (gene, metabolite) pairs by the set of routes that name them: 6 pairs TCDB only, 3 TCDB and GO (urea, once per gene), 3 GO only. Per gene, `by_gene[].multi_source_metabolite_count` says how many of its metabolites two routes reach; per metabolite, `top_metabolites[].multi_source_gene_count` says how many genes. A GO-only pair is not wrong, and a TCDB + GO pair is corroborated, not proven (the two routes share homology)."

verbose_fields:
  - gene_category
  - metabolite_inchikey
  - metabolite_smiles
  - metabolite_mnxm_id
  - metabolite_hmdb_id
  - reaction_mnxr_id
  - reaction_rhea_ids
  - tcdb_level_kind
  - tc_class_id
  - go_chebi_ids

chaining:
  # upstream — gene-set producers
  - "differential_expression_by_gene(organism=..., direction='up') → metabolites_by_gene(locus_tags=DE_genes, organism=..., metabolite_elements=['N']) (N-source batch)"
  - "genes_in_cluster(cluster_ids=...) → metabolites_by_gene(locus_tags=cluster_genes, organism=...) (cluster chemistry)"
  - "genes_by_function(search_text=..., organism=...) → metabolites_by_gene(locus_tags=function_hit_genes, organism=...) (function-search chemistry)"
  - "gene_overview(locus_tags=[...]) → per-row reaction_count/catalyzed_metabolite_count > 0 → metabolites_by_gene(locus_tags=chemistry_genes, organism=...)"
  - "gene_overview(locus_tags=[...]) → per-row transported_metabolite_count > 0 → metabolites_by_gene(locus_tags=[...], organism=..., evidence_sources=['transport']) — distinct Metabolite targets in the direct rows equal transported_metabolite_count"
  - "gene_overview(locus_tags=[...]) → per-row tcdb_assignment_count > 0 and transported_metabolite_count = 0 → metabolites_by_gene(locus_tags=[...], organism=..., evidence_sources=['transport'], include_tcdb_family_substrates=True) for family-level candidates (a gene whose evidence_sources lists 'transport' has a role-only direct system; those rows return by default)"

  # downstream from envelope — top_metabolites
  - "metabolites_by_gene → top_metabolites → list_metabolites(metabolite_ids=[top_metabolite_ids]) for richer per-metabolite cross-refs (mass, formula, full pathway names)"
  - "metabolites_by_gene → top_metabolites → list_metabolites(metabolite_ids=[top_metabolite_ids], organism_names=[partner_organism]) for cross-organism presence (cross-feeding seed)"
  - "metabolites_by_gene → top_metabolites → genes_by_metabolite(metabolite_ids=[top_metabolite_ids], organism=PARTNER_ORGANISM) (cross-feeding bridge — catalysts + transporters in partner)"
  - "metabolites_by_gene → stereo_relatives → genes_by_metabolite(metabolite_ids=[generic substrate id], organism=..., include_stereo_forms=True) to join this gene's generic-form transport with the specific form's catalysts"

  # downstream from envelope — top_metabolite_pathways (chemistry-pathway-filtered)
  - "metabolites_by_gene → top_metabolite_pathways → list_metabolites(pathway_ids=[metabolite_pathway_id]) for the full metabolite roster of the pathway (not just gene-set hits)"
  - "metabolites_by_gene → top_metabolite_pathways → genes_by_ontology(ontology='kegg', term_ids=[metabolite_pathway_id], organism=...) for gene-KO-mediated pathway annotations (different surface — see top_metabolite_pathways naming disambiguation)"
  - "metabolites_by_gene → top_metabolite_pathways → pathway_enrichment(...) when gene-set hypothesis test is the goal"

  # downstream from envelope — top_reactions / top_tcdb_families
  - "metabolites_by_gene → top_reactions → genes_by_ontology(ontology='ec', term_ids=[ec_number], organism=...) for genes in adjacent reactions"
  - "metabolites_by_gene → top_tcdb_families → genes_by_ontology(ontology='tcdb', term_ids=[tcdb_family_id], organism=...) for sibling genes in the same family"
  - "metabolites_by_gene → warning / tcdb_family_substrates_skipped → gene_ontology_terms(locus_tags=[...], ontology='tcdb', organism=...) to see every gated TCDB call the gene carries (add include_weak_tcdb_hits=True for its below-gate DIAMOND hits)"

  # downstream from not_matched (annotation-context drill-out)
  - "metabolites_by_gene → not_matched (locus_tags with no row under the active filters) → gene_overview(locus_tags=not_matched) for annotation context (many are richly-annotated non-chemistry genes, not annotation gaps)"
  - "gene_overview(locus_tags=[...]) → evidence_sources contains 'go_transport' → metabolites_by_gene(locus_tags=[...], organism=..., evidence_sources=['go_transport']) for the GO term and target behind the tag"
  - "metabolites_by_gene → go_transport rows with target_kind='chemical_role' → genes_by_metabolite(metabolite_ids=[role id], organism=...) for every gene that reaches the same role (siderophore, xenobiotic, drug, toxin, vitamin)"

mistakes:
  - >-
    An empty TCDB arm is not "no transporter". TCDB rows are direct systems by
    default, and for a gene with a TCDB call an empty arm has two readings; the
    warning names which applies. (1) The gene is placed only at family or
    subfamily level: read `tcdb_family_substrates_not_shown`, then pass
    `include_tcdb_family_substrates=True` for `tcdb_route='family'` rows (phnD
    PMM0673 → 5 metabolites via tcdb:3.A.1.9). (2) Its only usable call is on a
    superfamily curated with over 200 substrates (ABC tcdb:3.A.1, MFS
    tcdb:2.A.1): it is listed in `tcdb_family_substrates_skipped` and its
    substrate is unknown. With a metabolite filter (`metabolite_ids`,
    `metabolite_elements`, ...) the list keeps only superfamilies that carry
    a matching metabolite. Genes with only weak DIAMOND hits (`below_gate`)
    reach no substrate here; `gene_ontology_terms(...,
    include_weak_tcdb_hits=True)` shows them. See `docs://analysis/transport`.
  - >-
    A `go_transport` row is a GO term definition, not a gene fact; whether the
    gene deserves the term is `go_sources` / `go_evidence`. A biological-process
    term (for example "iron ion transport") also covers storage and regulation,
    so a gene carrying it is not necessarily a transporter (MED4 `ftn` reaches
    iron this way): check `go_namespace` and prefer molecular-function rows for
    "is this gene a transporter". Rows with `target_kind='chemical_role'` name a
    class (siderophore, xenobiotic, drug, toxin, vitamin), not a compound.
  - >-
    A transporter's substrates are usually the generic, stereo-unspecified
    node ('Cysteine'), because TCDB names them that way; the enzymes sit on
    the specific form ('L-Cysteine'). Stereo forms are separate nodes and no
    count combines across them, so don't conclude "no enzyme uses what this
    gene imports" from these rows. Read envelope `stereo_relatives` (keyed by
    result metabolite; counts cover the whole organism, not your input genes)
    and per-row `stereo_relative_ids`, then route to
    `genes_by_metabolite(..., include_stereo_forms=True)`. Class terms and
    ring vs open-chain forms are never linked, so no hint is not proof of no
    related compound.
  - >-
    Use `summary=True` for batch DE inputs (50+ locus_tags). Detail rows
    can exceed 1,000 quickly once family rows are on; the
    envelope rollups (top_metabolites, top_metabolite_pathways,
    top_reactions, top_tcdb_families, by_element, by_gene,
    top_gene_categories) are the actually-useful artifact at that scale.
  - >-
    Rank TCDB direct rows (one per gene × TC system × metabolite, from the
    gene's `tcdb_gate='direct'` calls) by `tcdb_identity` (percent; null on
    eggNOG-only rows, which is not weaker), then `tcdb_calls` (eggNOG plus a
    DIAMOND kind is independent agreement; the two DIAMOND kinds come from one
    run). Distinct direct Metabolite targets per gene equal
    `gene_overview.transported_metabolite_count` (cynD PMM0372: 3; role rows
    excluded), and metabolite-side distinct direct genes, unioned over
    organisms, equal `list_metabolites.transporter_gene_count`.
  - >-
    Family rows are a recall expansion. The walk starts from the gene's
    deepest `annotated` family or subfamily call, never above one of its own
    direct systems, and reports every curated substrate of the systems under
    it (`tcdb_substrate_system_count` systems per row). TCDB curation passes
    through as-is: catch-all substrates ("Peptide", "Protein")
    appear, and pstS (PMM0710) reaches only triphosphate because TCDB curates
    its Pst system that way. Most remaining noise is eggNOG family calls on
    genes that are not transporters. `docs://analysis/transport`.
  - >-
    Direction is thin. `tcdb_direction` (`uptake` / `export` / `unknown`) is
    TCDB's direction for the row's node, not a per-gene call; most nodes, and
    nearly all family rows, read `unknown`. KEGG reaction rows are not
    directional at all (no substrate-vs-product role, no reversibility flag):
    read a metabolism row as "catalyses a reaction involving this metabolite",
    never "produces" or "consumes". To distinguish for a gene, layer
    `differential_expression_by_gene` and functional annotation
    (`gene_overview`).
  - >-
    Rows from all three arms share one schema. Fields that belong to another
    arm are `None` (`tcdb_*` on KEGG and GO rows; `reaction_*`, `ec_numbers`
    and `mass_balance` on TCDB and GO rows; `go_*` on KEGG and TCDB rows).
    Null optional fields (`gene_name`; formula, mass and ChEBI id on role rows)
    can be left out of a row entirely, so read them with `row.get(...)`.
    Branch on `evidence_source`.
  - >-
    Filters are scoped per arm. `ec_numbers` and `mass_balance` narrow the
    metabolism arm only; TCDB and GO rows pass through unchanged.
    `include_tcdb_family_substrates` widens TCDB only; `go_include_ancestors`,
    `go_namespace` and `go_evidence` touch GO only (set while
    `evidence_sources` excludes `go_transport`, they are ignored with a
    warning). `metabolite_elements`, `metabolite_ids`,
    `exclude_metabolite_ids`, `metabolite_pathway_ids` and `gene_categories`
    apply to all three arms. To restrict to one arm, set `evidence_sources`
    explicitly.
  - >-
    `metabolite_elements` is presence-only AND-of: `['N']` keeps metabolites
    that contain N, `['N', 'P']` requires both. Never substring-match on
    `formula` (`'Cl'` contains `'C'`, `'Na'` contains `'N'`). It never
    matches a metabolite with no formula: mostly generic classes such as
    'amino acid', 'dipeptide' or 'Polyamine', plus role rows on the GO arm, so
    an element filter can silently drop N-bearing transport substrates. The
    envelope reports the loss in `no_formula_excluded` (rows) and
    `no_formula_excluded_metabolites` plus a `warnings` entry; re-run without
    `metabolite_elements` to inspect them.
  - >-
    `by_element` envelope is presence-only — count of distinct metabolites
    containing each element at all. NOT stoichiometric (atom counts live in
    `metabolite.formula`); NOT mass-balanced (KG `Reaction_has_metabolite`
    is undirected and carries no substrate/product role).
  - >-
    There is no `top_genes` envelope field. The per-gene rollup IS `by_gene`
    (one entry per input locus_tag that produced at least one row; a
    gene with zero rows does not appear; it is listed in `not_matched`. Populated identically in
    summary and detail modes — `rows` / `metabolite_count` / `reaction_count` / `transporter_count`
    / `metabolism_rows` / `tcdb_direct_rows` / `tcdb_family_rows` /
    `tcdb_assignment_count`). The compound-anchored counterpart
    `top_metabolites` exists (sorted by gene_count); there's no symmetric
    `top_genes` because gene-anchored aggregation already lives in `by_gene`.
  - >-
    `top_metabolite_pathways` here means *KEGG pathways the gene set's
    chemistry reaches* (via `Reaction_in_kegg_pathway` +
    `Metabolite_in_pathway`). These are NOT the same as gene-KO-mediated
    pathway annotations (where pathway membership is asserted by the gene's
    KO assignment) — those live in `genes_by_ontology(ontology='kegg',
    term_ids=[...], organism=...)`. For metabolic pathway analysis with a
    hypothesis test, use `pathway_enrichment` instead.
  - >-
    `not_found.locus_tags` vs `not_matched`. `not_found.locus_tags` =
    locus_tags that don't resolve to any Gene in the requested organism
    (typo, wrong organism, gene removed in KG rebuild). `not_matched` = tags
    that resolve to a Gene but return no row under the active filters: no
    reaction, no direct TCDB system (family-only and superfamily-only genes
    land here; see the warning), and no GO transport term. Many housekeeping
    genes fall here. Pivot via `gene_overview(locus_tags=not_matched)`.
  - >-
    A multi-source pair is corroborated, not proven. `by_evidence_source_combination`,
    `by_gene[].multi_source_metabolite_count` and
    `top_metabolites[].multi_source_gene_count` count the (gene, metabolite) pairs
    that two or more routes name, but the routes share homology (InterPro2GO and
    eggNOG vs the TCDB calls), so agreement raises confidence without being
    independent confirmation. A single-source pair is not wrong.
  - >-
    An empty GO answer for H+, Na+ or an upper-level class is curation, not
    biology (`Schema_info.go_transport_excluded_targets`, surfaced by
    `kg_release_info`).
  - >-
    When `top_metabolites` is dominated by ATP / ADP / NADH / NADPH / H2O,
    pass `exclude_metabolite_ids=[<kegg.compound:Cxxxxx>]` to strip the
    currency-cofactor noise. Exclude wins on overlap with `metabolite_ids`
    (silent) and applies to all three arms.
  - >-
    `gene_categories` filter is partially redundant with `locus_tags` input
    (since the input already constrains the gene set). It's useful only as
    further narrowing within a broad batch — e.g. `locus_tags=DE_genes,
    gene_categories=['Transport and binding']` to slice DE chemistry to
    transport-classified genes only. Don't use it as the primary anchor.
  - >-
    Gene-anchored (locus_tags → metabolites). The metabolite-anchored
    mirror is `genes_by_metabolite` (metabolite → genes); both share the
    same row class, discriminators and per-arm filter scope.
  - >-
    Single organism per call. There is no `organisms` list. For
    cross-organism / cross-feeding work, call `metabolites_by_gene` once on
    the focal organism, take `top_metabolites`, then route to
    `genes_by_metabolite(metabolite_ids=[...], organism=partner)` (or
    `list_metabolites(metabolite_ids=[...], organism_names=[partner])` for
    presence-only).
  - >-
    `'metabolomics'` is not accepted in `evidence_sources` here (allowed:
    `metabolism`, `transport`, `go_transport`). Measurements have no gene
    anchor; for measurement evidence use `list_metabolite_assays` /
    `assays_by_metabolite`.
  - >-
    A row with `metabolite_structure_kind='generic'` names a compound class (e.g. fatty
    acid, peptide), not one molecule — read it as "some member of this class".
  - wrong: "metabolites_by_gene(locus_tags=['PMM0673'], organism='MED4')  # 0 transport rows, then reporting phnD as 'no transporter'"
    right: "metabolites_by_gene(locus_tags=['PMM0673'], organism='MED4', include_tcdb_family_substrates=True)  # after reading the warning; family rows are candidates, not calls"
  - wrong: "metabolites_by_gene(..., metabolite_ids=['C00064'])  # then treating `C00064` in `not_found` as 'no such metabolite'"
    right: "IDs in any form (bare, prefixed, ChEBI / HMDB / MNX / InChIKey, retired) resolve before the query; read `resolved_aliases`. `chebi.role:<n>` ids, and the `chebi:` id of a role, resolve to the role and return role rows. Removed compounds warn. See docs://analysis/metabolites, 'Metabolite ID forms'."
  - "See `docs://analysis/metabolites` (evidence sources: metabolism, TCDB transport, GO transport, metabolomics) and `docs://analysis/transport` for reading the transport routes; `docs://guide/concepts` has the chemistry layer overview."
  - "`not_found.organism` is set when the `organism` name resolves to zero organisms — check it before reading an empty result as 'no chemistry here'."
  - "With `include_tcdb_family_substrates=True`, one gene on a broad family can fill `limit` on its own (family rows sort after direct rows): page with `offset`, or use `summary=True` and read `by_gene`."
