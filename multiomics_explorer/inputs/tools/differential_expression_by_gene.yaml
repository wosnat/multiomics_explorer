    # filtered to zero by `direction` / `significant_only` / `growth_phases` / `treatment_type` /
    # `background_factors`. A typo'd id would land in `not_found_experiments`.

  - title: Both significant directions in one call (direction='both')
    call: differential_expression_by_gene(organism="MED4", direction="both", summary=True)
    # Returns the union of `significant_up` and `significant_down` rows
    # (excludes `not_significant`). Functionally identical to
    # `direction=None, significant_only=True` — pick whichever spelling
    # is clearer at the call site.

  - title: Chaining — find genes then check expression
    steps: |
      Step 1: genes_by_function(search_text="nitrogen transport", organism="HOT1A3")
              → collect locus_tags from results

      Step 2: differential_expression_by_gene(locus_tags=["ACZ81_01830", ...], summary=True)
              → check rows_by_status for significant hits, check by_table_scope for data completeness

      Step 3: differential_expression_by_gene(locus_tags=["ACZ81_01830", ...], significant_only=True, limit=20)
              → get the significant expression rows

verbose_fields:
  - product
  - experiment_name
  - treatment
  - gene_category
  - omics_type
  - coculture_partner
  - table_scope
  - table_scope_detail
  - background_factors
  - timepoints

chaining:
  - "genes_by_function → differential_expression_by_gene"
  - "genes_by_ontology → differential_expression_by_gene"
  - "gene_overview → differential_expression_by_gene (check expression_edge_count first)"
  - "list_experiments → differential_expression_by_gene (filter by table_scope there, pass experiment_ids)"
  - "differential_expression_by_gene → list_experiments(experiment_ids=[...], verbose=True) for the partner roles of a coculture experiment — `coculture_partner` (verbose-only here) is a flat list of every organism sharing the culture, treatment and background partners alike; `coculture_partners[].role` on list_experiments tells them apart"

mistakes:
  - wrong: "Interpreting absence of a row as 'no change' when truncated=true"
    right: "Check truncated flag; use summary=True for reliable counts or increase limit"
  - wrong: "Assuming no_expression means 'not differentially expressed'"
    right: "no_expression means no data available — gene may not have been profiled in those experiments"
  - wrong: "Reading an empty `results=[]` as 'no DE response' when experiment_ids was passed"
    right: "Check not_found_experiments (typo'd id) and not_matched_experiments (id real but no edges satisfy the filter — e.g. vesicle proteomics, or a too-strict significant_only). Empty results + non-empty not_matched_experiments means the filter eliminated every row, not that the gene didn't respond."
  - wrong: "Interpreting a missing gene as 'not affected' without checking table_scope"
    right: "Check the experiment's table_scope — if significant_only or top_n, the gene may simply not have been reported. Only all_detected_genes experiments can distinguish 'not affected' from 'not reported'."
  - wrong: "Mixing organisms in a single call (e.g. MED4 + HOT1A3 locus_tags)"
    right: "Call once per organism — tool enforces single-organism constraint"
  - wrong: "differential_expression_by_gene(organism='Prochlorococcus', summary=True)  # genus word"
    right: "differential_expression_by_gene(organism='MED4', summary=True)  # organism= is a word-based, case-insensitive match on preferred_name + name_synonyms — 'MED4' works; a bare genus word matches every strain and raises 'matches multiple organisms — be more specific'"
  - "`direction` and `significant_only` interplay: when direction is 'up' / 'down' / 'both' it filters expression_status directly and `significant_only` is ignored (direction='up', significant_only=False still returns only significant_up rows). `significant_only=True` only matters with direction=None, where it drops not_significant rows — i.e. it equals direction='both'. Pick whichever spelling is clearer at the call site; default direction=None, significant_only=False returns everything."
  - "treatment_type / background_factors / growth_phase values are LIVE vocabularies read from the KG, not enums. An unknown growth_phases value (e.g. 'log' instead of 'exponential') now reports in the envelope `warnings` (e.g. \"growth_phases value 'log' matched nothing — valid values: ... (list_filter_values(filter_type='growth_phase'))\") — check `warnings` before trusting an empty or reduced result. Check list_filter_values(filter_type='growth_phase') or list_experiments(summary=True)'s by_treatment_type / by_background_factors rollup before filtering. Current treatment values are short nouns (nitrogen, light, carbon, iron, darkness, phosphorus, salt, viral, coculture, diel, ...); background_factors are light, axenic, coculture, darkness, diel, viral, chemical. Here they surface as the treatment_type / background_factors / growth_phases filters and the rows_by_treatment_type / rows_by_background_factors / rows_by_growth_phase summary keys."
  - wrong: "Assuming a growth_phases typo silently returns 0 rows with no signal"
    right: "A growth_phases / treatment_type / background_factors value not in the live vocabulary lands in the envelope `warnings` (one entry per bad value), and any gene whose expression edges exist but fail to match direction / significant_only / growth_phases / treatment_type / background_factors lands in `filtered_out` — never in `no_expression`, which is reserved for a gene with NO Changes_expression_of edge at all in the organism."
  - "`no_expression` is this tool's name for the not_matched bucket — a gene exists but has NO Changes_expression_of edge at all in the organism; `filtered_out` is the DIFFERENT bucket for a gene that DOES have edges but none survive direction / significant_only / growth_phases / treatment_type / background_factors (including a vocabulary typo); `not_found` = locus_tag absent; experiment ids get their own `not_found_experiments` / `not_matched_experiments` pair. See docs://guide/conventions for the shared not_found / not_matched semantics."
  - wrong: "Treating `rank_up` / `rank_down` as genome-wide directional ranks (e.g. as the ranked list for a GSEA-style test or a genome-wide null)"
    right: "They are populated ONLY on the significant subset — `rank_up` is non-null on significant_up genes, `rank_down` on significant_down genes; every non-significant gene is null and silently drops out. The one rank present on every reported edge is `rank` (KG property `rank_by_effect`, surfaced here under the shorter name), which is |log2FC|-based and direction-blind. For a signed genome-wide ranking sort the rows by `log2fc` yourself over an `all_detected_genes` experiment (check `table_scope` first), and use `rank_up` / `rank_down` only as validation handles for the significant tail."
  - "expression_status uses publication-specific thresholds, not a uniform padj<0.05"
  - "Use summary=True first to see the landscape, then drill into specific genes/experiments"
  - "Check by_table_scope in the summary to understand data completeness before drawing conclusions"
  - "growth_phase is a timepoint-level condition describing the culture's physiological state at sampling — NOT a gene-specific property"
  - "A DE timepoint label (e.g. 'day 18') and `growth_phase` describe the treatment arm; check `control_timing` / `design_notes` before reading it as both arms' state. See docs://guide/conventions."
  - "For cross-experiment summarization (which treatments does this gene set respond to?) see `docs://analysis/expression` — `response_matrix` for gene × treatment pivots, `gene_set_compare` for two-set overlap. For pathway-level interpretation chain to `pathway_enrichment` (`docs://analysis/enrichment`)."
  - wrong: "Expecting per-timepoint counts, experiment_name, or table_scope_detail inside `experiments[]` from a plain call"
    right: "`summary=True` (and every call by default) is the cheap landscape — each `experiments[]` entry is compact (experiment_id, treatment_type, table_scope, control_timing, design_notes when present, is_time_course, matching_genes, rows_by_status, omics_type). Per-timepoint counts and the other experiment metadata (experiment_name, background_factors, coculture_partner, table_scope_detail) need `verbose=True`."
  - "At least one of `organism` / `locus_tags` / `experiment_ids` is required — calling with none of the three raises ValueError. Use list_organisms for organisms, resolve_gene for locus_tags, or list_experiments for experiment_ids."
