  - title: Filter to curated Cyanorak groups
    call: search_homolog_groups(search_text="kinase", source="cyanorak", max_specificity_rank=0)

  - title: Filter by CyanorakRole
    call: search_homolog_groups(search_text="transport", cyanorak_roles=["cyanorak.role:D.1.5"])

  - title: Find groups then get member genes
    steps: |
      Step 1: search_homolog_groups(search_text="nitrogen regulatory")
              → extract group_id values from results

      Step 2: genes_by_homolog_group(group_ids=["cyanorak:CK_00000468"])
              → see member genes per organism

verbose_fields:
  - description
  - functional_description
  - genera
  - has_cross_genus_members
  - cyanorak_roles
  - cog_categories

chaining:
  - "search_homolog_groups → genes_by_homolog_group → differential_expression_by_ortholog"
  - "gene_homologs → inspect group → search_homolog_groups for similar"

mistakes:
  - "Searching by group ID (e.g. 'COG0592') will not work — group IDs are not in the fulltext index. Use the group_id from results directly."
  - wrong: "len(results)  # actual result count"
    right: "response['total_matching']  # use total, not len"
  - "A leading '-' (e.g. '-kinase') is Lucene NOT; mid-word hyphens are fine ('beta-glycosyltransferase' and 'beta glycosyltransferase' return the same groups)."
  - "`search_text` is Lucene — see docs://guide/conventions for syntax and scoring."
