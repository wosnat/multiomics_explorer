  - title: A TIGR main role and its sub roles (tigr.role CURIE)
    call: ontology_term_details(term_ids=["tigr.role:energy_metabolism"])
    note: "TigrRole is two-level: main roles use a slug CURIE (`tigr.role:energy_metabolism`, level 0, `level_kind='tigr_mainrole'`), sub roles a numeric one (`tigr.role:112`, level 1). Genes attach to sub roles only (`direct_gene_count` 0 on a main role; `gene_count` is the subtree). `ncbifam_family_count` counts the NCBIfam families whose router link points here — the NCBIfam → TigrRole bridge is recall-biased routing, not a gene-function call."
