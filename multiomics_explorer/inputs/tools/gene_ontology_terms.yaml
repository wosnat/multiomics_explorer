  - title: TCDB leaf mode — gated targets, one row per gene × TC node (default)
    call: gene_ontology_terms(locus_tags=["PMM0372", "PMM0710"], organism="MED4", ontology=["tcdb"], mode="leaf", verbose=True)
    note: "Leaf mode on tcdb keeps the gene's gate-passing edges (`tcdb_gate` direct or annotated) and drops any node that is an ancestor of another gated target, so the row count per gene equals `gene_overview.tcdb_assignment_count`. cynD (PMM0372) gives 2 sibling-system rows; pstS (PMM0710) gives 1 row whose `tcdb_calls` lists all three call kinds (walk-through: `docs://analysis/annotation_evidence`, scenario `tcdb_gate`). When several edges point at the same node, the row reports one by precedence (`tcdb_call` best hit, then tier, then eggNOG; then identity). DIAMOND detail (`identity`, `qcov` in percent, `evalue`, `tcdb_scov`, `tcdb_best_hit_rank`, `tcdb_bitscore`, `tcdb_bitscore_ratio`) is verbose-only."

  - title: Weak TCDB hits are opt-in — include_weak_tcdb_hits=True adds the below-gate DIAMOND rows
    call: gene_ontology_terms(locus_tags=["PMM0125", "PMM0024"], organism="MED4", ontology=["tcdb"], include_weak_tcdb_hits=True)
    note: "The switch only adds rows, each tagged `tcdb_gate='below_gate'`; the default rows come back unchanged. ecfA1 (PMM0125) keeps its 7 eggNOG subfamily rows and gains 3 best-hit system rows; thiL (PMM0024) has no default row and gains its one tier-3 hit (walk-through: `docs://analysis/annotation_evidence`, scenario `tcdb_gate`). A below-gate edge on an ancestor of a row already returned is skipped, but weak rows can sit below a default row (ecfA1: tcdb:3.A.1.25.5 under tcdb:3.A.1.25); the leaf rule is not re-run. Passing the switch with a non-TCDB ontology is a no-op."

