  - title: Filter TCDB rows by call kind — tcdb_call=['eggnog']
    call: gene_ontology_terms(locus_tags=["PMM0372", "PMM0710"], organism="MED4", ontology=["tcdb"], tcdb_call=["eggnog"])
    note: "`tcdb_call` keeps only rows whose edges are of the listed kinds (`eggnog`, `diamond_tier`, `diamond_best_hit`; `list_filter_values('tcdb_call')`). The leaf rule still runs on every gated edge, so the filter never promotes an ancestor to a leaf. cynD keeps its eggNOG system tcdb:3.A.1.16.1. pstS drops out: its eggNOG call sits on tcdb:3.A.1.7, an ancestor of its best-hit system, so it is not a leaf. Envelope `by_tcdb_call` counts rows by representative call. With a single non-TCDB ontology the filter raises; with an ontology list it applies to tcdb and skips the rest."

