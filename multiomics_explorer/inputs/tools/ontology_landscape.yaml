# Auto-generated sections (params, response format, expected-keys)
# come from Pydantic models via scripts/build_about_content.py.

examples:
  - title: Default survey — which ontology/level should I use for MED4?
    call: ontology_landscape(organism="MED4")
    note: "One row per (ontology × level) — BRITE per tree, InterPro per `interpro_type` — ranked by `relevance_rank`. `by_ontology` is an object keyed by ontology name (`brite:<tree>` for BRITE) with each ontology's best level. Ranks and coverages shift with each KG build; read the live response, not this one. All 17 ontologies are surveyed by default (`n_ontologies`)."
