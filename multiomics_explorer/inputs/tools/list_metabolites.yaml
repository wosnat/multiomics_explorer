  - title: TCDB substrate catalogue (metabolite-level)
    call: list_metabolites(evidence_sources=["transport"], summary=True)
    note: "Every compound some TCDB system lists as a substrate, catalysed or not: `evidence_sources` is ANY-match and catalogue-level. Transport-only = rows with `catalyst_gene_count = 0` and `transporter_gene_count > 0`; filter rows client-side."

  - title: One organism's transport reach — organism_names + evidence_sources scope each other
    call: list_metabolites(organism_names=["Prochlorococcus MED4"], evidence_sources=["transport"], elements=["N"], summary=True)
    note: "With both filters set, a metabolite matches only when MED4 itself reaches it by a TCDB transport route, so the roster is far smaller than the `evidence_sources=['transport']` catalogue for N. `top_organisms` counts each organism by the listed routes only."

