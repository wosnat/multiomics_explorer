  - title: Stereo relatives — generic Cysteine carries the transport, L-Cysteine the catalysis
    call: list_metabolites(metabolite_ids=["kegg.compound:C00736", "kegg.compound:C00097"])
    note: "Each row's `stereo_relatives` names the other stereo forms with their own KG-wide gene counts: Cysteine's `specific_form` relatives are L- and D-Cysteine, L-Cysteine's are its `enantiomer` D-Cysteine and its `unspecified_form` Cysteine. No count combines across forms. Rows with no relative have no `stereo_relatives` key."

