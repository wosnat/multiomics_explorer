verbose_fields:
  - assay_name
  - field_description

chaining:
  - "list_metabolite_assays(value_kind='boolean') → metabolites_by_flags_assay(assay_ids=[...])  # discovery → drill-down"
  - "metabolites_by_flags_assay → assays_by_metabolite(metabolite_ids=[...])  # quantifies-arm complement (cross-organism reverse view)"
  - "metabolites_by_flags_assay → genes_by_metabolite(metabolite_ids=[...], organism=...)  # gene catalysts/transporters of these metabolites"
  - "metabolites_by_flags_assay → metabolites_by_gene(locus_tags=[...], organism=...)  # gene-anchored chemistry context"

mistakes:
  - "Boolean arm only (`Assay_flags_metabolite`). Siblings: `metabolites_by_quantifies_assay` is the numeric-arm twin (values, detection_status, rankable buckets); `assays_by_metabolite` is the metabolite-anchored reverse lookup over both arms."
  - wrong: "metabolites_by_flags_assay(assay_ids=[...])  # then citing an L-amino-acid row as 'the paper detected L-alanine'"
    right: "`stereo_assignment` says who chose the stereo form: `as_reported` (the paper) or `dominant_form_assumed` (the KG placed an unspecified name such as 'Alanine' on L-alanine). Pass `stereo_assignment=['as_reported']` when the form matters, or quote assumed rows as 'L-form assumed'. Full reading: `assays_by_metabolite` docs and docs://analysis/metabolites."
  - wrong: "A requested assay_id silently disappears from the results and not_found.assay_ids stays empty."
    right: |
      `not_found.assay_ids` is a real existence check — an unknown assay_id lands
      there. A numeric assay_id is genuinely found (it exists as
      `value_kind='numeric'`) but this tool only drills boolean edges — it's
      excluded from `not_found.assay_ids` and reported via a `warnings` entry
      naming `metabolites_by_quantifies_assay` as the tool to use instead.
  - wrong: "Drop value=0 / flag_value=False rows as noise, or read a metabolite missing from the results as 'not detected'."
    right: "value=0 / flag_value=False / detection_status='not_detected' rows are tested-absent (assayed, not found): real biology, kept by default. A metabolite missing from the results is unmeasured in this scope. See docs://analysis/metabolites, 'Tested-absent vs unmeasured'."

  - wrong: "Expect by_detection_status in the envelope."
    right: |
      by_detection_status exists only on the numeric arm (its source field
      lives on `Assay_quantifies_metabolite` edges). On boolean,
      `flag_value` IS the qualitative-detection signal; `by_value` is its
      envelope rollup (true / false counts).

  - wrong: "Expect not_found to be a flat list[str]."
    right: "`not_found` is a dict keyed by input: assay_ids, metabolite_ids, experiment_ids, publication_dois. Inspect each bucket to see which input was bad."

  - wrong: "flag_value=False returns 0 rows like genes_by_boolean_metric does."
    right: |
      `Assay_flags_metabolite` always stores both states — about 69% of
      boolean rows are `flag_value=false`, and flag_value=False returns real
      rows. On the derived-metric side only some boolean DMs store
      `not_flagged` edges, so `genes_by_boolean_metric(flag_value=False)` is
      DM-dependent — read its `by_metric[*].dm_false_count` first.

  - wrong: "excluded_assays / warnings will surface gating diagnostics."
    right: |
      `excluded_assays` is always `[]` here (no gates) — kept for cross-tool
      envelope-shape consistency with `metabolites_by_quantifies_assay`.
      Boolean assays have no `rankable` gate to probe. `warnings` carries only
      metabolite-ID notes (a removed compound or a chemical-role id in
      `metabolite_ids`) and the assumed-stereo-form count (see
      `stereo_assignment`).

  - wrong: "growth_phase populated on every row."
    right: "growth_phase is null on every metabolomics row (not yet recorded in the KG); don't read null as 'no growth phase'."

  - wrong: "metabolites_by_flags_assay(metabolite_ids=['C00064'])  # then treating `C00064` in `not_found` as 'no such metabolite'"
    right: "IDs in any form (bare, prefixed, ChEBI / HMDB / MNX / InChIKey, retired) resolve before the query; read `resolved_aliases`. Removed compounds and chemical-role ids stay in `not_found` with a warning. See docs://analysis/metabolites, 'Metabolite ID forms'."
  - "See `docs://analysis/metabolites` (evidence sources: metabolism, TCDB transport, GO transport, metabolomics) and `docs://guide/conventions` for tested-absent semantics (about 69% of boolean rows are flag_value=False, kept by default)."
  - "`organism` here matches by case-insensitive CONTAINS, not the word-based match the gene tools use; cross-organism is the default."
