  - title: Presence-only — flag_value=True
    call: metabolites_by_flags_assay(assay_ids=["metabolite_assay:msystems.01261-22:presence_flags_table_s2:presence_flag_intracellular"], flag_value=True)
    # 35 rows — the metabolites flagged as detected on the msystems
    # intracellular assay (matches by_value.true=35 in the canonical example).
    # `Assay_flags_metabolite` always stores both states ('detected' /
    # 'not_detected' in the KG, bool on the surface), so flag_value=True
    # is presence-only (35 of 93 rows), not "all rows".

  - title: Tested-absent slice — flag_value=False
    call: metabolites_by_flags_assay(assay_ids=["metabolite_assay:msystems.01261-22:presence_flags_table_s2:presence_flag_intracellular"], flag_value=False)
    # 58 rows — the metabolites assayed and explicitly flagged as NOT
    # detected on this single assay (matches by_value.false=58 per-assay).
    # Real biology — about 69% of boolean rows are flag_value=false. Don't
    # conflate with missing rows (those would mean unmeasured, not in this
    # assay's scope). See `docs://guide/conventions`.

  - title: Summary — flag-distribution headline without rows
    call: metabolites_by_flags_assay(assay_ids=["metabolite_assay:msystems.01261-22:presence_flags_table_s2:presence_flag_intracellular"], summary=True)
    # Same envelope as the canonical example but results=[]. by_value is
    # the qualitative-detection signal on the boolean arm — no
    # by_detection_status here (that field exists only on numeric edges).

  - title: Cross-assay — both boolean assays at once (intracellular + extracellular)
    call: metabolites_by_flags_assay(assay_ids=["metabolite_assay:msystems.01261-22:presence_flags_table_s2:presence_flag_intracellular", "metabolite_assay:msystems.01261-22:presence_flags_table_s2_extracellular:presence_flag_extracellular"])
    note: "`by_assay` carries one row per assay (intracellular vs extracellular flags). `by_compartment` splits them (`whole_cell` vs `extracellular`). Useful for asking \"does this metabolite show up inside the cell, outside, or both?\" on the msystems panel."

  - title: Metabolite-anchored — does PEP show up at all on the boolean assays?
    call: metabolites_by_flags_assay(assay_ids=["metabolite_assay:msystems.01261-22:presence_flags_table_s2:presence_flag_intracellular", "metabolite_assay:msystems.01261-22:presence_flags_table_s2_extracellular:presence_flag_extracellular"], metabolite_ids=["kegg.compound:C00074"])
    # 2 rows total (1 per assay) — both flag_value=false. Most PEP
    # measurements across the metabolomics layer are tested-absent. Pair
    # with metabolites_by_quantifies_assay for the numeric-arm edges.

