  - title: Find a TCDB system by a protein symbol (verbose shows the protein list)
    call: search_ontology(search_text="UrtA", ontology=["tcdb"], verbose=True, limit=2)
    note: "TCDB search covers each system's `proteins` cell (gene symbols, accessions, source organism), so a gene symbol such as UrtA finds the urea porters. `proteins` is a verbose column, set on `tc_system` nodes only; it is TCDB's text for the reference system, not a call on any KG gene."
