  - title: Browse per organism — which TCDB families are biggest in MED4
    call: search_ontology(ontology=["tcdb"], level=2, organism="MED4", min_gene_count=5)
    note: "organism= scopes the count: rows gain organism_gene_count, and the sort and min_gene_count apply to it (gene_count stays KG-wide). 'MED4' resolves to 'Prochlorococcus MED4'. organism_gene_count is subtree-scoped (term + descendants), the same number ontology_term_details(organism=...) reports — tcdb:3.A.1 in MED4 reads 65 on both tools."
