  - title: Discovery via fulltext (Capovilla chitosan paper)
    call: list_metabolite_assays(search_text="chitosan")

  - title: Pre-flight for numeric drill-down
    call: list_metabolite_assays(value_kind="numeric", rankable=True)

  - title: Find assays measuring a specific metabolite
    call: list_metabolite_assays(metabolite_ids=["kegg.compound:C00074"])  # PEP — covered by 10 of the 14 assays (8 numeric + 2 boolean)

  - title: Per-paper inventory
    call: list_metabolite_assays(publication_dois=["10.1073/pnas.2213271120"])

verbose_fields:
  - treatment
  - light_condition
  - experimental_context

chaining:
  - "list_metabolite_assays → metabolites_by_quantifies_assay(assay_ids=[...])"
  - "list_metabolite_assays → metabolites_by_flags_assay(assay_ids=[...])"
  - "list_metabolite_assays → assays_by_metabolite(metabolite_ids=[...])  # cross-organism reverse view"
  - "list_metabolite_assays → list_metabolites(metabolite_ids=[...])  # chemistry context for measured compounds"

mistakes:
  - wrong: "Drop value=0 / flag_value=False rows as noise, or read a metabolite missing from the results as 'not detected'."
    right: "value=0 / flag_value=False / detection_status='not_detected' rows are tested-absent (assayed, not found): real biology, kept by default. A metabolite missing from the results is unmeasured in this scope. See docs://analysis/metabolites, 'Tested-absent vs unmeasured'."

  - wrong: "growth_phases=[] means the assay has no growth-state metadata."
    right: "growth_phase is not yet recorded on any metabolomics experiment in the KG, so `by_growth_phase` is empty and a `growth_phases` filter matches nothing; don't read that as 'no growth phase'."

  - wrong: "metabolite_count_total = total distinct metabolites across matching assays."
    right: "metabolite_count_total is *cumulative*: same metabolite measured by N assays counts N times. For distinct counts route to assays_by_metabolite(metabolite_ids=..., summary=True) → metabolites_matched, or list_metabolites(metabolite_ids=...)."

  - wrong: "Calling metabolites_by_quantifies_assay with bucket / metric_percentile filters before checking assay rankable."
    right: "Call list_metabolite_assays(value_kind='numeric', rankable=True) first. Drill-down's rankable-gated filters raise if every selected assay has rankable=False, soft-exclude on mixed input."

  - wrong: "list_metabolite_assays(metabolite_ids=['C00064'])  # then treating `C00064` in `not_found` as 'no such metabolite'"
    right: "IDs in any form (bare, prefixed, ChEBI / HMDB / MNX / InChIKey, retired) resolve before the query; read `resolved_aliases`. Removed compounds and chemical-role ids stay in `not_found` with a warning. See docs://analysis/metabolites, 'Metabolite ID forms'."
  - "See `docs://analysis/metabolites` (evidence sources: metabolism, TCDB transport, GO transport, metabolomics) and `docs://guide/conventions` for tested-absent semantics across the metabolomics layer."
  - "A genus word alone in `organism=` (e.g. 'Alteromonas') matches every strain in that genus rather than raising ambiguous."
