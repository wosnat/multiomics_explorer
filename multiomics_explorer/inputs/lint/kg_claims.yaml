- id: med4_tcdb_gene_scale
  cypher: >
    MATCH (g:Gene {organism_name: 'Prochlorococcus MED4'})
    WITH g, coalesce(g.tcdb_assignment_count, 0) > 0 AS gated,
         coalesce(g.transported_metabolite_count, 0) > 0 AS reaches,
         EXISTS { MATCH (g)-[:Gene_has_tcdb_family {tcdb_gate: 'direct'}]->() } AS has_direct
    RETURN sum(CASE WHEN gated THEN 1 ELSE 0 END) AS gated_genes,
           sum(CASE WHEN reaches THEN 1 ELSE 0 END) AS direct_substrate_genes,
           sum(CASE WHEN gated AND NOT has_direct THEN 1 ELSE 0 END) AS gated_no_direct
  expect: {gated_genes: 203, direct_substrate_genes: 56, gated_no_direct: 98}
  used_in:
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/transport.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/metabolites.md
  note: "MED4: 203 genes with a gated TCDB call, 56 reach a substrate directly, 98 gated but no direct edge"

