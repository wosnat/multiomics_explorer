    RETURN count(d) AS dms,
           sum(CASE WHEN d.value_kind = 'numeric' THEN 1 ELSE 0 END) AS numeric,
           sum(CASE WHEN d.value_kind = 'boolean' THEN 1 ELSE 0 END) AS boolean,
           sum(CASE WHEN d.value_kind = 'categorical' THEN 1 ELSE 0 END) AS categorical,
           count(DISTINCT d.metric_type) AS metric_types,
           sum(CASE WHEN d.compartment = 'whole_cell' THEN 1 ELSE 0 END) AS whole_cell
