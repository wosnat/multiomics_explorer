  cypher: >
    MATCH (p:KeggTerm {level_kind: 'pathway'}) WHERE NOT (p)-[:Kegg_term_is_a_kegg_term]->()
    RETURN count(p) AS parentless,
           sum(CASE WHEN p.is_uninformative = 'true' THEN 1 ELSE 0 END) AS flagged
  expect: {parentless: 13, flagged: 11}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/mcp_server/tools.py
    - multiomics_explorer/inputs/ontologies/kegg.yaml
    - multiomics_explorer/skills/multiomics-kg-guide/references/guide/conventions.md
