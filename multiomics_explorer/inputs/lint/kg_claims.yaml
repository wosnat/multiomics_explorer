- id: tcdb_gate_edge_counts
  cypher: >
    MATCH ()-[e:Gene_has_tcdb_family]->()
    WITH sum(CASE WHEN e.tcdb_gate = 'direct' THEN 1 ELSE 0 END) AS direct,
           sum(CASE WHEN e.tcdb_gate = 'annotated' THEN 1 ELSE 0 END) AS annotated,
           sum(CASE WHEN e.tcdb_gate = 'below_gate' THEN 1 ELSE 0 END) AS below_gate
    RETURN below_gate > direct + annotated AS below_gate_majority
  expect: {below_gate_majority: true}
  quoted:
    - 'Most edges are `below_gate`'
  used_in:
