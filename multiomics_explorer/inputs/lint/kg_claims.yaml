- id: kegg_ko_prefix
  cypher: >
    MATCH (k:KeggTerm {level_kind: 'ko'})
    RETURN count(k) AS ko_terms,
           sum(CASE WHEN k.id STARTS WITH 'kegg.orthology:' THEN 1 ELSE 0 END) AS prefixed,
           sum(CASE WHEN k.id =~ 'kegg:K\\d+' THEN 1 ELSE 0 END) AS retired_prefix
  expect: {retired_prefix: 0}
  used_in:
    - multiomics_explorer/inputs/ontologies/kegg.yaml
    - multiomics_explorer/inputs/ontologies/brite.yaml
    - multiomics_explorer/inputs/tools/genes_by_ontology.yaml
  note: "all KO ids use the kegg.orthology: prefix; kegg:K… is retired (prefixed == ko_terms is asserted separately)"

- id: kegg_uninformative_by_level_kind
  cypher: >
    MATCH (k:KeggTerm)
    WHERE k.is_uninformative = 'true'
    RETURN sum(CASE WHEN k.level_kind = 'ko' THEN 1 ELSE 0 END) AS ko_flagged,
           sum(CASE WHEN k.level_kind = 'pathway' THEN 1 ELSE 0 END) AS pathway_flagged
  expect: {ko_flagged: 212, pathway_flagged: 11}
  tolerance: {rel: 0.05}
  used_in:
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/enrichment.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/guide/conventions.md
    - multiomics_explorer/inputs/ontologies/kegg.yaml
    - examples/pathway_enrichment.py
  note: >
    KO-level catch-alls (212) plus 11 of the 13 parentless global / overview pathway maps
    (ko01100 …; ko01310 / ko01320 kept informative) carry is_uninformative (KG DOC-002, 2026-08-29).

