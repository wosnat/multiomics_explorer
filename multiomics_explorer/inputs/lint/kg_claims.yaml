    WITH size(coalesce(m.kegg_functional_categories, [])) > 0 AS f,
         size(coalesce(m.kegg_brite_classes, [])) > 0 AS b
    RETURN count(*) AS catalysed,
           sum(CASE WHEN NOT f THEN 1 ELSE 0 END) AS catalysed_without_category,
           sum(CASE WHEN f OR b THEN 1 ELSE 0 END) AS catalysed_with_either
  expect: {catalysed: 2221, catalysed_without_category: 1974, catalysed_with_either: 687}
  tolerance: {rel: 0.05}
  quoted:
    - '1,974 metabolites with catalyst genes'
  used_in:
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/metabolites.md
  note: >
    Of metabolites with catalyst genes, 1,974 have no functional category and 687 have
    either KEGG classification field (KEGG-categories subsection of analysis/metabolites.md).

