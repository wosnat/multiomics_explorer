- id: tcdb_direction_conservative
  cypher: >
    MATCH (t:TcdbFamily)
    RETURN sum(CASE WHEN t.level_kind <> 'tc_system' AND t.direction <> 'unknown'
                     AND coalesce(t.direction_basis, '') <> 'abc_numbering' THEN 1 ELSE 0 END) AS non_system_named,
           sum(CASE WHEN t.direction = 'export' AND t.direction_basis = 'abc_numbering' THEN 1 ELSE 0 END) AS abc_export
  expect: {non_system_named: 0, abc_export: 0}
  used_in:
