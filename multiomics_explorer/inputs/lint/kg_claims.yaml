- id: eggnog_only_edges_not_curated
  cypher: >
    MATCH ()-[r]->()
    WHERE type(r) IN ['Gene_involved_in_biological_process', 'Gene_enables_molecular_function',
                      'Gene_located_in_cellular_component', 'Gene_catalyzes_ec_number',
                      'Gene_has_pfam', 'Gene_has_cazy_family']
      AND r.sources = ['eggnog']
    RETURN count(r) AS eggnog_only,
           sum(CASE WHEN r.evidence = 'curated' THEN 1 ELSE 0 END) AS read_curated,
           sum(CASE WHEN r.evidence = 'family_inferred' THEN 1 ELSE 0 END) AS read_family_inferred
  expect: {read_curated: 0}
  used_in:
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/annotation_evidence.md
    - multiomics_explorer/inputs/ontologies/go_bp.yaml
    - multiomics_explorer/inputs/ontologies/ec.yaml
    - multiomics_explorer/inputs/ontologies/pfam.yaml
    - multiomics_explorer/inputs/ontologies/cazy.yaml
  note: >
    Behavioural claim: eggNOG-only GO / EC / Pfam / CAZy edges read evidence='family_inferred',
    never 'curated' (KG DOC-001). Fails ⇒ annotation_evidence.md's ladder description and
    the per-ontology evidence notes are wrong for this build.
