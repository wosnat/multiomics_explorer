# Register of KG-describing numbers quoted in docs. Each entry pairs the
# Cypher that computes the fact with the value the docs quote and the files
# that quote it. tests/integration/test_docs_kg_claims.py (-m kg) evaluates
# every entry against the live KG; a failure names the `used_in` files to fix.
# tests/unit/test_docs_lint.py checks every `used_in` path exists.
#
# Entry fields:
#   id          unique slug
#   cypher      RETURN exactly one row; column names == `expect` keys
#   expect      {column: value} — numbers, strings or booleans
#   tolerance   optional {abs: x} or {rel: fraction} applied to numeric columns
#   used_in     list of repo-relative paths that quote the number
#   note        free text (what the number means / how the docs phrase it)
#   source      optional "ontology_config" — value computed from the explorer
#               registry rather than Cypher (cypher omitted)

- id: numeric_assay_not_detected_share
  cypher: >
    MATCH ()-[e:Assay_quantifies_metabolite]->()
    WITH count(e) AS total,
         sum(CASE WHEN e.detection_status = 'not_detected' THEN 1 ELSE 0 END) AS nd
    RETURN total, nd, round(100.0 * nd / total, 1) AS not_detected_pct
  expect: {total: 1480, nd: 1046, not_detected_pct: 70.7}
  tolerance: {rel: 0.02}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/metabolites.md
    - multiomics_explorer/inputs/tools/metabolites_by_quantifies_assay.yaml
    - multiomics_explorer/mcp_server/tools.py
  note: "share of numeric Assay_quantifies_metabolite edges that are tested-absent (docs: '~71%')"

- id: boolean_assay_false_share
  cypher: >
    MATCH ()-[e:Assay_flags_metabolite]->()
    WITH count(e) AS total,
         sum(CASE WHEN e.flag_value = 'not_detected' THEN 1 ELSE 0 END) AS f
    RETURN total, f AS false_n, round(100.0 * f / total, 1) AS false_pct
  expect: {total: 186, false_n: 128, false_pct: 68.8}
  tolerance: {rel: 0.02}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/metabolites.md
    - multiomics_explorer/inputs/tools/metabolites_by_flags_assay.yaml
    - multiomics_explorer/mcp_server/tools.py
  note: "share of boolean Assay_flags_metabolite edges with flag_value=false (docs: '~69%')"

- id: boolean_dms_storing_not_flagged
  cypher: >
    MATCH (d:DerivedMetric {value_kind: 'boolean'})
    OPTIONAL MATCH (d)-[e:Derived_metric_flags_gene]->()
    WITH d, sum(CASE WHEN e.value = 'not_flagged' THEN 1 ELSE 0 END) AS nf
    RETURN count(d) AS boolean_dms, sum(CASE WHEN nf > 0 THEN 1 ELSE 0 END) AS storing_not_flagged
  expect: {boolean_dms: 27, storing_not_flagged: 11}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/inputs/tools/genes_by_boolean_metric.yaml
    - multiomics_explorer/mcp_server/tools.py
  note: "genes_by_boolean_metric flag_value=False returns rows on 11 of 27 boolean DMs"

- id: publications_discusses_split
  cypher: >
    MATCH (p:Publication)
    OPTIONAL MATCH (p)-[d:Publication_discusses_gene|Publication_discusses_kegg_pathway]->()
    WITH p, count(d) AS n
    RETURN count(p) AS publications,
           sum(CASE WHEN n > 0 THEN 1 ELSE 0 END) AS has_discusses,
           sum(CASE WHEN n = 0 THEN 1 ELSE 0 END) AS no_discusses
  expect: {publications: 49, has_discusses: 45, no_discusses: 4}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/inputs/tools/list_publications.yaml
    - multiomics_explorer/inputs/tools/discussed_by_publication.yaml
    - multiomics_explorer/mcp_server/tools.py
  note: "by_discusses_coverage split 45 vs 4 of 49; 'not_matched' pubs = 4"

- id: metabolomics_layer_counts
  cypher: >
    MATCH (a:MetaboliteAssay)
    OPTIONAL MATCH (p:Publication)-[:PublicationHasMetaboliteAssay]->(a)
    OPTIONAL MATCH (e:Experiment)-[:ExperimentHasMetaboliteAssay]->(a)
    OPTIONAL MATCH (a)-[:MetaboliteAssayBelongsToOrganism]->(o:OrganismTaxon)
    OPTIONAL MATCH (a)-[:Assay_quantifies_metabolite|Assay_flags_metabolite]->(m:Metabolite)
    RETURN count(DISTINCT p) AS publications, count(DISTINCT e) AS experiments,
           count(DISTINCT a) AS assays, count(DISTINCT o) AS organisms,
           count(DISTINCT m) AS metabolites
  expect: {publications: 3, experiments: 12, assays: 14, organisms: 5, metabolites: 149}
  tolerance: {abs: 0}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/analysis/metabolites.md
    - multiomics_explorer/inputs/tools/list_publications.yaml
    - multiomics_explorer/inputs/tools/list_experiments.yaml
    - multiomics_explorer/inputs/tools/list_metabolite_assays.yaml
  note: "'the 3 metabolomics publications' / '12 metabolomics experiments' / 14 assays / 5 organisms / ~149 measured metabolites"

- id: organism_taxon_counts
  cypher: >
    MATCH (o:OrganismTaxon)
    OPTIONAL MATCH (g:Gene)-[:Gene_belongs_to_organism]->(o)
    WITH o, count(g) AS n
    RETURN count(o) AS nodes, count(DISTINCT o.preferred_name) AS distinct_names,
           sum(CASE WHEN n > 0 THEN 1 ELSE 0 END) AS with_genes
  expect: {nodes: 48, distinct_names: 47, with_genes: 43}
  used_in:
    - CLAUDE.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/guide/concepts.md
    - multiomics_explorer/skills/multiomics-kg-guide/references/guide/conventions.md
    - multiomics_explorer/inputs/tools/list_organisms.yaml
  note: "48 OrganismTaxon rows / 47 distinct preferred_name (Meiothermus ruber duplicate) / 43 carry genes"

